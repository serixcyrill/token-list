<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSCI Index Overlay · Vemo UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
    }

    /* Widget namespace */
    .msci-overlay {
      --bg-gradient: radial-gradient(64% 80% at 10% 12%, rgba(126, 217, 87, 0.12), transparent),
        radial-gradient(52% 74% at 88% 6%, rgba(91, 124, 250, 0.12), transparent),
        linear-gradient(180deg, #fbfcff 0%, #eef3ff 55%, #eaf0ff 100%);
      --panel: rgba(255, 255, 255, 0.9);
      --panel-strong: rgba(255, 255, 255, 0.98);
      --text-strong: #0b162c;
      --text-muted: #60708c;
      --border-soft: rgba(17, 24, 39, 0.05);
      --shadow-soft: 0 12px 32px rgba(15, 23, 42, 0.08);
      --radius-card: 18px;
      --radius-chip: 18px;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-gradient);
      padding: 28px 18px 22px;
      color: var(--text-strong);
      max-width: none;
      margin: 0;
    }

    .msci-overlay *,
    .msci-overlay *::before,
    .msci-overlay *::after {
      box-sizing: border-box;
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.9);
      border: 1px solid var(--border-soft);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #1d9c59;
    }

    .eyebrow .dot {
      width: 8px;
      height: 8px;
      background: #7ed957;
      border-radius: 50%;
    }

    h1 {
      font-family: "Poppins", system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -0.4px;
      font-size: clamp(38px, 3.2vw, 52px);
      margin: 12px 0 4px;
      color: var(--text-strong);
    }

    .subtitle {
      color: var(--text-muted);
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.1px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin: 18px 0 6px;
    }

    @media (max-width: 900px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .input {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.05);
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 14px;
      min-width: 280px;
      color: #0b162c;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 12px 28px rgba(15, 23, 42, 0.06);
      transition: all 0.2s ease;
    }

    .input:focus {
      outline: none;
      border-color: rgba(91, 124, 250, 0.28);
      box-shadow: 0 0 0 6px rgba(91, 124, 250, 0.12);
      background: var(--panel-strong);
    }

    .input::placeholder { color: rgba(91, 107, 130, 0.8); }

    .chip-group { display: inline-flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-chip);
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text-strong);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    .chip .dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.03); }

    .chip:hover { transform: translateY(-1px); background: var(--panel-strong); }

    .chip.active {
      background: linear-gradient(135deg, rgba(91, 124, 250, 0.16), rgba(126, 217, 87, 0.14));
      border-color: rgba(91, 124, 250, 0.32);
      color: #0f172a;
      box-shadow: 0 14px 26px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }

    .chart-card {
      position: relative;
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.9), rgba(248, 251, 255, 0.92));
      border: none;
      border-radius: 22px;
      box-shadow: var(--shadow-soft);
      padding: 16px 16px 12px;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .chart-card::before,
    .chart-card::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 10%;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), transparent 70%);
    }

    .chart-card::after {
      right: 0;
      transform: scaleX(-1);
    }

    .chart-card::before { left: 0; }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      z-index: 3;
      position: relative;
    }

    .chart-title { font-size: 15px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.2px; }

    canvas { width: 100% !important; height: 420px !important; }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .index-card {
      position: relative;
      border-radius: 18px;
      padding: 16px 16px 14px;
      color: #0b162c;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
      background: #ffffff;
      backdrop-filter: blur(2px);
    }

    .index-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.28), transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .index-card:hover { transform: translateY(-2px); }
    .index-card:hover::after { opacity: 0.24; }

    .index-card.selected {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.12);
      transform: translateY(-2px);
    }

    .index-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .index-name { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: inherit; }
    .index-flag { font-size: 20px; }
    .index-sub { font-size: 13px; opacity: 0.92; font-weight: 700; color: rgba(15, 23, 42, 0.65); }

    .index-card.selected .index-sub { color: rgba(255, 255, 255, 0.82); }

    .disclaimer {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      canvas { height: 340px !important; }
      .input { min-width: 100%; }
    }
  </style>
</head>
  <body style="margin:0; padding:0; background:linear-gradient(180deg,#fbfcff 0%,#eef3ff 55%,#eaf0ff 100%);">
  <div class="msci-overlay">
    <div class="topline">
      <div>
        <div class="eyebrow"><span class="dot"></span> MSCI Overlay · Live FMP API</div>
        <h1>Globale Index-Performance</h1>
        <p class="subtitle">Vergleiche Märkte übereinander – Euro-Basis, log als Standard, FMP-Feed mit fallback.</p>
      </div>
    </div>

    <div class="controls-grid">
      <div class="control-row">
        <input class="input" id="search" type="search" placeholder="Suchen nach Land oder Index" />
        <div class="chip-group" id="range-chips"></div>
        <div class="chip-group" id="scale-chips"></div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title" id="chart-title">ACWI plus ausgewählte Märkte</div>
        <div class="chip-group" id="legend"></div>
      </div>
      <canvas id="chart"></canvas>
    </div>

    <div class="grid-cards" id="cards"></div>
    <div class="disclaimer">API: Financial Modeling Prep (FMP) – Angaben ohne Gewähr, keine Haftung für die Richtigkeit der Daten.</div>
  </div>

  <script>
    const indexCatalog = [
      { id: 'ACWI', name: 'MSCI ACWI', country: 'Global', flag: '🌍', colors: ['#7ed957', '#5b7cfa'], symbol: 'ACWI' },
      { id: 'USA', name: 'MSCI USA', country: 'USA', flag: '🇺🇸', colors: ['#7aa5f9', '#f1b5c8'], symbol: 'SPY' },
      { id: 'GER', name: 'MSCI Deutschland', country: 'Deutschland', flag: '🇩🇪', colors: ['#f6c28f', '#f49fa7'], symbol: 'EWG' },
      { id: 'UK', name: 'MSCI UK', country: 'Vereinigtes Königreich', flag: '🇬🇧', colors: ['#9bb7ff', '#f2b1c0'], symbol: 'EWU' },
      { id: 'FRA', name: 'MSCI Frankreich', country: 'Frankreich', flag: '🇫🇷', colors: ['#92b6ff', '#f6c3d8'], symbol: 'EWQ' },
      { id: 'ITA', name: 'MSCI Italien', country: 'Italien', flag: '🇮🇹', colors: ['#9adab6', '#f2b5b5'], symbol: 'EWI' },
      { id: 'ESP', name: 'MSCI Spanien', country: 'Spanien', flag: '🇪🇸', colors: ['#f6c490', '#f5a1aa'], symbol: 'EWP' },
      { id: 'CAN', name: 'MSCI Kanada', country: 'Kanada', flag: '🇨🇦', colors: ['#f29aa5', '#f7d7df'], symbol: 'EWC' },
      { id: 'BRA', name: 'MSCI Brasilien', country: 'Brasilien', flag: '🇧🇷', colors: ['#7fd9b0', '#f5e3a4'], symbol: 'EWZ' },
      { id: 'MEX', name: 'MSCI Mexiko', country: 'Mexiko', flag: '🇲🇽', colors: ['#7acdb0', '#f2b7bf'], symbol: 'EWW' },
      { id: 'AUS', name: 'MSCI Australien', country: 'Australien', flag: '🇦🇺', colors: ['#92b9ff', '#f3b8c1'], symbol: 'EWA' },
      { id: 'JPN', name: 'MSCI Japan', country: 'Japan', flag: '🇯🇵', colors: ['#f2a2b8', '#f8e9ea'], symbol: 'EWJ' },
      { id: 'CHN', name: 'MSCI China', country: 'China', flag: '🇨🇳', colors: ['#f3a590', '#f7e7b0'], symbol: 'MCHI' },
      { id: 'IND', name: 'MSCI Indien', country: 'Indien', flag: '🇮🇳', colors: ['#f6bb86', '#8fd8b0'], symbol: 'INDY' },
      { id: 'KOR', name: 'MSCI Korea', country: 'Südkorea', flag: '🇰🇷', colors: ['#9ac1ff', '#f0a3ba'], symbol: 'EWY' },
      { id: 'ZAF', name: 'MSCI Südafrika', country: 'Südafrika', flag: '🇿🇦', colors: ['#7fc7b3', '#f2b59a'], symbol: 'EZA' },
      { id: 'SAU', name: 'MSCI Saudi-Arabien', country: 'Saudi-Arabien', flag: '🇸🇦', colors: ['#7ed4aa', '#f1fff6'], symbol: 'KSA' },
      { id: 'ARE', name: 'MSCI VAE', country: 'VAE', flag: '🇦🇪', colors: ['#7fd2b6', '#f3b0b0'], symbol: 'UAE' },
    ];

    const ranges = [
      { id: 'max', label: 'Max', months: null },
      { id: '5y', label: '5J', months: 60 },
      { id: '3y', label: '3J', months: 36 },
      { id: '1y', label: '1J', months: 12 },
      { id: '6m', label: '6M', months: 6 },
    ];

    const state = {
      search: '',
      range: 'max',
      scale: 'log',
      selected: ['ACWI', 'USA', 'GER'],
    };

    const chartEl = document.getElementById('chart');
    let chart;
    let labelTimeline = [];
    let usdToEur = 0.92;
    const normalizedSeries = {};

    // --- helpers ---
    function hexToRgba(hex, alpha = 1) {
      if (hex.startsWith('rgb')) return hex;
      const parsed = hex.replace('#', '');
      const bigint = parseInt(parsed.length === 3 ? parsed.split('').map((c) => c + c).join('') : parsed, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function pastelize(hex, mix = 0.28, alpha = 1) {
      if (hex.startsWith('rgb')) return hex;
      const parsed = hex.replace('#', '');
      const bigint = parseInt(parsed.length === 3 ? parsed.split('').map((c) => c + c).join('') : parsed, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      const blend = (v) => Math.round(v * (1 - mix) + 255 * mix);
      return `rgba(${blend(r)}, ${blend(g)}, ${blend(b)}, ${alpha})`;
    }

    function blendColors(colors) {
      if (!colors.length) return ['rgba(91, 124, 250, 0.86)', 'rgba(126, 217, 87, 0.5)'];
      const primary = pastelize(colors[0], 0.12, 0.92);
      const secondary = pastelize(colors[1] || colors[0], 0.22, 0.7);
      return [primary, secondary];
    }

    function setAlpha(color, alpha) {
      if (color.startsWith('rgba')) return color.replace(/rgba\(([^)]+), [0-9.]+\)/, `rgba($1, ${alpha})`);
      return hexToRgba(color, alpha);
    }

    function formatCurrency(value) {
      if (!Number.isFinite(value)) return '';
      return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(value);
    }

    function sliceRange(dates, series) {
      const range = ranges.find((r) => r.id === state.range);
      if (!range || !range.months) return { dates, series };
      const tailDate = new Date(dates[dates.length - 1]);
      const cutoff = new Date(tailDate);
      cutoff.setMonth(cutoff.getMonth() - range.months);
      const slicedDates = [];
      const slicedSeries = [];
      dates.forEach((d, i) => {
        const dt = new Date(d);
        if (dt >= cutoff) {
          slicedDates.push(d);
          slicedSeries.push(series[i]);
        }
      });
      return { dates: slicedDates, series: slicedSeries };
    }

    function pickGradient(ctx, colors) {
      const [start, end] = blendColors(colors);
      const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height * 0.9);
      gradient.addColorStop(0, setAlpha(start, 0.28));
      const tail = end.replace(/rgba\(([^)]+), [0-9.]+\)/, 'rgba($1, 0.08)');
      gradient.addColorStop(1, tail);
      return gradient;
    }

    // --- data ---
    function seededRandom(seed) {
      let t = seed + 0x6d2b79f5;
      return () => {
        t += 0x6d2b79f5;
        let x = t;
        x = Math.imul(x ^ (x >>> 15), 1 | x);
        x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }

    const growthBias = { ACWI: 0.0065, USA: 0.0075, GER: 0.0066, FRA: 0.0062, ITA: 0.0059, ESP: 0.0059, UK: 0.0058, CAN: 0.0063, BRA: 0.0069, MEX: 0.0065, AUS: 0.0061, JPN: 0.006, CHN: 0.0066, IND: 0.008, KOR: 0.0066, ZAF: 0.0062, SAU: 0.0061, ARE: 0.0062 };
    const volBias = { IND: 0.006, BRA: 0.008, MEX: 0.006, ZAF: 0.006, CHN: 0.006 };

    function createFallbackSeries(id, index, labels) {
      const seed = id.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0) + index * 17;
      const rand = seededRandom(seed);
      const baseDrift = growthBias[id] ?? 0.006;
      const vol = 0.012 + (volBias[id] ?? 0.0);
      let value = 10500 + index * 900;
      const series = [];
      labels.forEach((_, i) => {
        const cycle = Math.sin(i / 10.5) * 0.16 + Math.cos(i / 7.5) * 0.11;
        const shock = (rand() - 0.5) * vol * 2.1;
        const monthlyReturn = baseDrift * (1 + cycle) + shock;
        value *= Math.max(0.97, 1 + monthlyReturn);
        value = Math.max(value, 1200);
        series.push(value);
      });
      return { dates: labels, values: series };
    }

    // Replace with your own FMP API key for production use
    const FMP_API_KEY = 'demo';

    async function fetchUsdToEurRate() {
      const res = await fetch(`https://financialmodelingprep.com/api/v3/quote-short/EURUSD?apikey=${FMP_API_KEY}`);
      if (!res.ok) throw new Error('FX fetch failed');
      const data = await res.json();
      const price = Array.isArray(data) ? data[0]?.price : data?.price;
      if (!price || price <= 0) throw new Error('No FX price');
      return 1 / price;
    }

    function toMonthlySeries(sorted) {
      const buckets = new Map();
      sorted.forEach((item) => {
        const date = new Date(item.date);
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-01`;
        buckets.set(key, item.close);
      });
      const entries = Array.from(buckets.entries()).sort((a, b) => new Date(a[0]) - new Date(b[0]));
      return { dates: entries.map((e) => e[0]), values: entries.map((e) => e[1]) };
    }

    async function fetchFmpSeries(symbol) {
      const res = await fetch(
        `https://financialmodelingprep.com/api/v3/historical-price-full/${symbol}?from=1987-01-01&serietype=line&apikey=${FMP_API_KEY}`
      );
      if (!res.ok) throw new Error('Fetch failed');
      const data = await res.json();
      const historical = data?.historical;
      if (!historical?.length) throw new Error('No data');
      const sorted = [...historical].sort((a, b) => new Date(a.date) - new Date(b.date));
      return toMonthlySeries(sorted);
    }

    function alignToLabels(baseLabels, dates, values, fx) {
      if (!dates.length || !values.length) return Array(baseLabels.length).fill(null);
      const map = new Map();
      const factor = fx && fx > 0 ? fx : 1;
      dates.forEach((d, i) => map.set(d, (values[i] ?? null) * factor));
      return baseLabels.map((d) => (map.has(d) ? map.get(d) : null));
    }

    async function loadData() {
      try {
        usdToEur = await fetchUsdToEurRate();
      } catch (e) {
        usdToEur = 0.92;
      }

      let acwiSeries;
      try {
        acwiSeries = await fetchFmpSeries(indexCatalog[0].symbol);
      } catch (e) {
        const fallbackLabels = Array.from({ length: 120 }, (_, i) => {
          const d = new Date();
          d.setMonth(d.getMonth() - (120 - i));
          return d.toISOString().slice(0, 10);
        });
        acwiSeries = createFallbackSeries('ACWI', 0, fallbackLabels);
      }

      labelTimeline = acwiSeries.dates;
      normalizedSeries['ACWI'] = alignToLabels(labelTimeline, acwiSeries.dates, acwiSeries.values, usdToEur);

      await Promise.all(
        indexCatalog.slice(1).map(async (idx, i) => {
          try {
            const live = await fetchFmpSeries(idx.symbol);
            normalizedSeries[idx.id] = alignToLabels(labelTimeline, live.dates, live.values, usdToEur);
          } catch (err) {
            const fallback = createFallbackSeries(idx.id, i + 1, labelTimeline);
            normalizedSeries[idx.id] = alignToLabels(labelTimeline, fallback.dates, fallback.values, usdToEur);
          }
        })
      );

      renderRanges();
      renderScales();
      renderCards();
      buildChart();
    }

    // --- UI ---
    function buildChart() {
      const ctx = chartEl.getContext('2d');
      const datasets = [];
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      if (!state.selected.length) state.selected = ['ACWI'];

      state.selected.forEach((id) => {
        const info = indexCatalog.find((i) => i.id === id);
        if (!info) return;
        const series = normalizedSeries[id] || [];
        const { dates, series: slicedSeries } = sliceRange(labelTimeline, series);
        const [colorPrimary, colorSecondary] = blendColors(info.colors);
        const borderColor = setAlpha(colorPrimary, id === 'ACWI' ? 0.9 : 0.82);
        const gradient = id === 'ACWI' ? pickGradient(ctx, [colorPrimary, colorSecondary]) : 'transparent';
        datasets.push({
          label: `${info.name}`,
          data: slicedSeries,
          borderColor,
          backgroundColor: gradient,
          tension: 0.32,
          borderWidth: id === 'ACWI' ? 3 : 2.3,
          fill: id === 'ACWI',
          pointRadius: 0,
          pointHitRadius: 10,
          spanGaps: true,
        });

        const chip = document.createElement('div');
        chip.className = 'chip active';
        chip.style.background = colorPrimary;
        chip.style.color = '#ffffff';
        chip.style.borderColor = setAlpha(colorPrimary, 0.6);
        chip.innerHTML = `<span class="dot" style="background:${setAlpha(colorPrimary,0.82)}"></span>${info.flag} ${info.name}`;
        chip.onclick = () => {
          if (state.selected.includes(id)) {
            state.selected = state.selected.filter((x) => x !== id);
          } else {
            state.selected.push(id);
          }
          buildChart();
          renderCards();
        };
        legend.appendChild(chip);
      });

      const labels = sliceRange(labelTimeline, normalizedSeries[state.selected[0]] || []).dates;

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          animation: { duration: 500 },
          maintainAspectRatio: false,
          scales: {
            y: {
              type: state.scale === 'log' ? 'logarithmic' : 'linear',
              ticks: {
                callback: (val) => formatCurrency(val),
                maxTicksLimit: 6,
              },
              grid: { color: 'rgba(15,23,42,0.05)' },
            },
            x: {
              grid: { display: false },
              ticks: { maxTicksLimit: 6 },
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'nearest',
              intersect: false,
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${formatCurrency(ctx.parsed.y)}`,
                title: (items) => items[0]?.label || '',
              },
              backgroundColor: '#0f172a',
              borderColor: 'rgba(255,255,255,0.3)',
              borderWidth: 1,
              titleColor: '#fff',
              bodyColor: '#e2e8f0',
              padding: 10,
              displayColors: false,
            },
          },
        },
      });
    }

    function renderRanges() {
      const wrap = document.getElementById('range-chips');
      wrap.innerHTML = '';
      ranges.forEach((r) => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (state.range === r.id ? ' active' : '');
        chip.textContent = r.label;
        chip.onclick = () => {
          state.range = r.id;
          buildChart();
          renderCards();
        };
        wrap.appendChild(chip);
      });
    }

    function renderScales() {
      const wrap = document.getElementById('scale-chips');
      wrap.innerHTML = '';
      ['linear', 'log'].forEach((s) => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (state.scale === s ? ' active' : '');
        chip.textContent = s === 'log' ? 'Log' : 'Linear';
        chip.onclick = () => {
          state.scale = s;
          buildChart();
        };
        wrap.appendChild(chip);
      });
    }

    function renderCards() {
      const container = document.getElementById('cards');
      container.innerHTML = '';
      const search = state.search.trim().toLowerCase();
      indexCatalog
        .filter((i) => !search || i.name.toLowerCase().includes(search) || i.country.toLowerCase().includes(search))
        .forEach((idx) => {
          const card = document.createElement('div');
          const isSelected = state.selected.includes(idx.id);
          card.className = 'index-card' + (isSelected ? ' selected' : '');
          const colors = blendColors(idx.colors);
          const softA = setAlpha(colors[0], 0.4);
          const softB = setAlpha(colors[1], 0.26);
          if (isSelected) {
            card.style.backgroundImage = `linear-gradient(145deg, ${softA}, ${softB}), linear-gradient(160deg, #0f172a, #0b1222)`;
            card.style.borderColor = setAlpha(colors[0], 0.45);
            card.style.color = '#ffffff';
          } else {
            card.style.backgroundImage = 'none';
            card.style.backgroundColor = '#ffffff';
            card.style.borderColor = 'rgba(15,23,42,0.08)';
            card.style.color = '#0b162c';
          }
          card.innerHTML = `
            <div class="index-top">
              <div>
                <div class="index-name">${idx.flag} ${idx.name}</div>
                <div class="index-sub">${idx.country}</div>
              </div>
            </div>
          `;
          card.onclick = () => {
            if (state.selected.includes(idx.id)) {
              state.selected = state.selected.filter((x) => x !== idx.id);
            } else {
              state.selected.push(idx.id);
            }
            buildChart();
            renderCards();
          };
          container.appendChild(card);
        });
      const title = document.getElementById('chart-title');
      title.textContent = state.selected.length
        ? `${state.selected.length} Indexe – Basis ${ranges.find((r) => r.id === state.range)?.label || 'Max'}, ${
            state.scale === 'log' ? 'logarithmisch' : 'linear'
          }`
        : 'Bitte Index auswählen';
    }

    document.getElementById('search').addEventListener('input', (e) => {
      state.search = e.target.value;
      renderCards();
    });

    loadData();
  </script>
</body>
</html>
