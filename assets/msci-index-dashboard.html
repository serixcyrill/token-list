<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSCI Index Overlay · Vemo UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
    }

    /* Widget namespace */
    .msci-overlay {
      --bg-gradient: radial-gradient(36% 42% at 18% 20%, rgba(126, 217, 87, 0.18), transparent),
        radial-gradient(32% 40% at 84% 20%, rgba(91, 124, 250, 0.16), transparent),
        linear-gradient(180deg, #f9fbff 0%, #eef2ff 100%);
      --card-glass: rgba(255, 255, 255, 0.75);
      --panel-glass: rgba(255, 255, 255, 0.8);
      --text-strong: #0f172a;
      --text-muted: #5f6a86;
      --border-soft: rgba(17, 24, 39, 0.08);
      --shadow-strong: 0 24px 56px rgba(15, 23, 42, 0.16);
      --shadow-soft: 0 18px 42px rgba(15, 23, 42, 0.08);
      --radius-shell: 26px;
      --radius-card: 20px;
      --radius-chip: 14px;
      --blur: 12px;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-gradient);
      border-radius: var(--radius-shell);
      border: 1px solid var(--border-soft);
      padding: 28px 26px 26px;
      box-shadow: var(--shadow-strong);
      backdrop-filter: blur(var(--blur));
      color: var(--text-strong);
      max-width: 1320px;
      margin: 0 auto;
    }

    .msci-overlay *,
    .msci-overlay *::before,
    .msci-overlay *::after {
      box-sizing: border-box;
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid var(--border-soft);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #0f9c4a;
    }

    .eyebrow .dot {
      width: 8px;
      height: 8px;
      background: #7ed957;
      border-radius: 50%;
    }

    h1 {
      font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -0.4px;
      font-size: clamp(30px, 3vw, 38px);
      margin: 6px 0 2px;
      color: var(--text-strong);
    }

    .subtitle {
      color: var(--text-muted);
      font-weight: 600;
      margin: 0;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin: 14px 0 6px;
    }

    @media (max-width: 900px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .input {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-chip);
      padding: 11px 14px;
      font-size: 14px;
      min-width: 260px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .chip-group { display: inline-flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-chip);
      padding: 9px 13px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--text-strong);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }

    .chip.active {
      background: linear-gradient(135deg, rgba(126, 217, 87, 0.18), rgba(91, 124, 250, 0.18));
      border-color: rgba(126, 217, 87, 0.45);
      color: #0b4c28;
      transform: translateY(-1px);
    }

    .chart-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(243, 246, 255, 0.8));
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-soft);
      padding: 18px 18px 14px;
      overflow: hidden;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .chart-title { font-size: 15px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.2px; }

    canvas { width: 100% !important; height: 420px !important; }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .index-card {
      position: relative;
      border-radius: var(--radius-card);
      padding: 16px;
      color: #fff;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.18);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.08));
    }

    .index-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(0, 0, 0, 0.12));
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .index-card:hover { transform: translateY(-2px); }
    .index-card:hover::after { opacity: 0.5; }

    .index-card.selected {
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 22px 38px rgba(15, 23, 42, 0.2);
      transform: translateY(-2px);
    }

    .index-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .index-name { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .index-flag { font-size: 20px; }
    .index-sub { font-size: 13px; opacity: 0.92; font-weight: 700; }
    .index-change { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }

    .disclaimer {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      canvas { height: 340px !important; }
      .input { min-width: 100%; }
    }
  </style>
</head>
<body style="margin:0; padding:14px; background:#eef2ff;">
  <div class="msci-overlay">
    <div class="topline">
      <div>
        <div class="eyebrow"><span class="dot"></span> MSCI Overlay</div>
        <h1>Globale Index-Performance</h1>
        <p class="subtitle">Vergleiche Märkte übereinander – alles auf Basis prozentualer Entwicklung ab Start.</p>
      </div>
    </div>

    <div class="controls-grid">
      <div class="control-row">
        <input class="input" id="search" type="search" placeholder="Suchen nach Land oder Index" />
        <div class="chip-group" id="range-chips"></div>
        <div class="chip-group" id="scale-chips"></div>
      </div>
      <div class="control-row">
        <div class="chip-group" id="region-chips"></div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title" id="chart-title">ACWI plus ausgewählte Märkte</div>
        <div class="chip-group" id="legend"></div>
      </div>
      <canvas id="chart"></canvas>
    </div>

    <div class="grid-cards" id="cards"></div>
    <div class="disclaimer">API: Angaben ohne Gewähr, keine Haftung für die Richtigkeit der Daten.</div>
  </div>

  <script>
    const indexCatalog = [
      { id: 'ACWI', name: 'MSCI ACWI', country: 'Global', region: 'Global', flag: '🌍', colors: ['#3dd067', '#0f9c4a'] },
      { id: 'USA', name: 'MSCI USA', country: 'USA', region: 'Amerika', flag: '🇺🇸', colors: ['#d02630', '#1f3a93'] },
      { id: 'CAN', name: 'MSCI Kanada', country: 'Kanada', region: 'Amerika', flag: '🇨🇦', colors: ['#d40019', '#f2f2f2'] },
      { id: 'BRA', name: 'MSCI Brasilien', country: 'Brasilien', region: 'Amerika', flag: '🇧🇷', colors: ['#0f8a1a', '#f5d028'] },
      { id: 'MEX', name: 'MSCI Mexiko', country: 'Mexiko', region: 'Amerika', flag: '🇲🇽', colors: ['#006341', '#bf0a30'] },
      { id: 'GER', name: 'MSCI Deutschland', country: 'Deutschland', region: 'Europa', flag: '🇩🇪', colors: ['#000000', '#e00025', '#ffce00'] },
      { id: 'FRA', name: 'MSCI Frankreich', country: 'Frankreich', region: 'Europa', flag: '🇫🇷', colors: ['#00437a', '#e00025'] },
      { id: 'ITA', name: 'MSCI Italien', country: 'Italien', region: 'Europa', flag: '🇮🇹', colors: ['#008c45', '#ce2b37'] },
      { id: 'ESP', name: 'MSCI Spanien', country: 'Spanien', region: 'Europa', flag: '🇪🇸', colors: ['#aa151b', '#f1bf00'] },
      { id: 'UK', name: 'MSCI UK', country: 'Vereinigtes Königreich', region: 'Europa', flag: '🇬🇧', colors: ['#012169', '#c8102e'] },
      { id: 'SWE', name: 'MSCI Schweden', country: 'Schweden', region: 'Europa', flag: '🇸🇪', colors: ['#006aa7', '#fecc00'] },
      { id: 'CHE', name: 'MSCI Schweiz', country: 'Schweiz', region: 'Europa', flag: '🇨🇭', colors: ['#d52b1e', '#ffffff'] },
      { id: 'AUS', name: 'MSCI Australien', country: 'Australien', region: 'Asien', flag: '🇦🇺', colors: ['#002664', '#e4002b'] },
      { id: 'JPN', name: 'MSCI Japan', country: 'Japan', region: 'Asien', flag: '🇯🇵', colors: ['#bc002d', '#ffffff'] },
      { id: 'CHN', name: 'MSCI China', country: 'China', region: 'Asien', flag: '🇨🇳', colors: ['#de2910', '#ffde00'] },
      { id: 'IND', name: 'MSCI Indien', country: 'Indien', region: 'Asien', flag: '🇮🇳', colors: ['#ff9933', '#138808', '#000080'] },
      { id: 'KOR', name: 'MSCI Korea', country: 'Südkorea', region: 'Asien', flag: '🇰🇷', colors: ['#0f4c81', '#c7001e'] },
      { id: 'ZAF', name: 'MSCI Südafrika', country: 'Südafrika', region: 'Afrika', flag: '🇿🇦', colors: ['#007a4d', '#e03c31', '#002395'] },
      { id: 'SAU', name: 'MSCI Saudi-Arabien', country: 'Saudi-Arabien', region: 'Nahost', flag: '🇸🇦', colors: ['#006c35', '#ffffff'] },
      { id: 'ARE', name: 'MSCI VAE', country: 'VAE', region: 'Nahost', flag: '🇦🇪', colors: ['#00732f', '#000000', '#ff0000'] },
    ];

    // demo data generator
    const baseDates = (() => {
      const dates = [];
      const start = new Date();
      start.setFullYear(start.getFullYear() - 10);
      for (let i = 0; i <= 120; i++) {
        const d = new Date(start);
        d.setMonth(start.getMonth() + i);
        dates.push(d.toISOString().slice(0, 10));
      }
      return dates;
    })();

    const baseCurve = baseDates.map((_, i) => 100 * Math.exp(i * 0.012));

    function createSeries(vol = 0.08, drift = 1) {
      return baseCurve.map((p, i) => {
        const noise = Math.sin(i / 6) * vol * 18 + (Math.random() - 0.5) * vol * 10;
        return p * drift + noise;
      });
    }

    const priceData = Object.fromEntries(indexCatalog.map((idx, i) => {
      const drift = 1 + (Math.sin(i) * 0.12);
      const vol = 0.05 + (i % 3) * 0.02;
      return [idx.id, createSeries(vol, drift)];
    }));

    const ranges = [
      { id: 'max', label: 'Max', months: null },
      { id: '5y', label: '5J', months: 60 },
      { id: '3y', label: '3J', months: 36 },
      { id: '1y', label: '1J', months: 12 },
      { id: '6m', label: '6M', months: 6 },
    ];

    const regions = ['Alle', 'Global', 'Amerika', 'Europa', 'Asien', 'Afrika', 'Nahost'];

    const state = {
      search: '',
      region: 'Alle',
      range: 'max',
      scale: 'log',
      selected: ['ACWI', 'USA', 'GER'],
    };

    const chartEl = document.getElementById('chart');
    let chart;

    function normalize(series) {
      if (!series.length) return [];
      const first = series[0];
      return series.map(v => v / first); // growth factor, 1 = 0%
    }

    function sliceRange(dates, series) {
      const range = ranges.find(r => r.id === state.range);
      if (!range || !range.months) return { dates, series };
      const startIndex = Math.max(0, dates.length - range.months - 1);
      return { dates: dates.slice(startIndex), series: series.slice(startIndex) };
    }

    function formatPercent(factor) {
      const pct = (factor - 1) * 100;
      return `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`;
    }

    function pickGradient(ctx, colors) {
      const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height * 0.9);
      gradient.addColorStop(0, colors[0]);
      gradient.addColorStop(1, colors[1] || colors[0]);
      return gradient;
    }

    function buildChart() {
      const ctx = chartEl.getContext('2d');
      const datasets = [];
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      state.selected.forEach((id) => {
        const info = indexCatalog.find((i) => i.id === id);
        if (!info) return;
        const raw = priceData[id] || [];
        const norm = normalize(raw);
        const { dates, series } = sliceRange(baseDates, norm);
        const color = info.colors[0];
        const borderColor = info.colors[1] || info.colors[0];
        const gradient = pickGradient(ctx, [color, 'rgba(255,255,255,0)']);
        datasets.push({
          label: `${info.name}`,
          data: series,
          borderColor,
          backgroundColor: gradient,
          tension: 0.32,
          borderWidth: id === 'ACWI' ? 2.8 : 2,
          fill: true,
          pointRadius: 0,
          pointHitRadius: 10,
        });
        const chip = document.createElement('div');
        chip.className = 'chip active';
        chip.innerHTML = `<span class="dot" style="background:${borderColor}"></span>${info.flag} ${info.name}`;
        legend.appendChild(chip);
      });

      const labels = sliceRange(baseDates, normalize(priceData[state.selected[0]] || [])).dates;

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          animation: { duration: 500 },
          maintainAspectRatio: false,
          scales: {
            y: {
              type: state.scale === 'log' ? 'logarithmic' : 'linear',
              ticks: {
                callback: (val) => formatPercent(val),
                maxTicksLimit: 6,
              },
              grid: { color: 'rgba(15,23,42,0.06)' },
            },
            x: {
              grid: { display: false },
              ticks: { maxTicksLimit: 6 },
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'nearest',
              intersect: false,
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${formatPercent(ctx.parsed.y)}`,
                title: (items) => items[0]?.label || '',
              },
              backgroundColor: '#0f172a',
              borderColor: 'rgba(255,255,255,0.3)',
              borderWidth: 1,
              titleColor: '#fff',
              bodyColor: '#e2e8f0',
              padding: 10,
              displayColors: false,
            },
          },
        },
      });
    }

    function renderRanges() {
      const wrap = document.getElementById('range-chips');
      wrap.innerHTML = '';
      ranges.forEach((r) => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (state.range === r.id ? ' active' : '');
        chip.textContent = r.label;
        chip.onclick = () => { state.range = r.id; buildChart(); renderCards(); };
        wrap.appendChild(chip);
      });
    }

    function renderScales() {
      const wrap = document.getElementById('scale-chips');
      wrap.innerHTML = '';
      ['linear', 'log'].forEach((s) => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (state.scale === s ? ' active' : '');
        chip.textContent = s === 'log' ? 'Log' : 'Linear';
        chip.onclick = () => { state.scale = s; buildChart(); };
        wrap.appendChild(chip);
      });
    }

    function renderRegions() {
      const wrap = document.getElementById('region-chips');
      wrap.innerHTML = '';
      regions.forEach((r) => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (state.region === r ? ' active' : '');
        chip.textContent = r;
        chip.onclick = () => { state.region = r; renderCards(); };
        wrap.appendChild(chip);
      });
    }

    function renderCards() {
      const container = document.getElementById('cards');
      container.innerHTML = '';
      const search = state.search.trim().toLowerCase();
      indexCatalog
        .filter((i) => state.region === 'Alle' || i.region === state.region)
        .filter((i) => !search || i.name.toLowerCase().includes(search) || i.country.toLowerCase().includes(search))
        .forEach((idx) => {
          const card = document.createElement('div');
          card.className = 'index-card' + (state.selected.includes(idx.id) ? ' selected' : '');
          const colors = idx.colors.length === 1 ? [idx.colors[0], idx.colors[0]] : idx.colors;
          card.style.background = `linear-gradient(160deg, ${colors[0]}, ${colors[1] || colors[0]})`;
          const series = normalize(priceData[idx.id] || []);
          const latest = series.at(-1) || 1;
          const change = formatPercent(latest);
          card.innerHTML = `
            <div class="index-top">
              <div>
                <div class="index-name">${idx.flag} ${idx.name}</div>
                <div class="index-sub">${idx.country}</div>
              </div>
              <div class="index-change">${change}</div>
            </div>
          `;
          card.onclick = () => {
            if (state.selected.includes(idx.id)) {
              state.selected = state.selected.filter((x) => x !== idx.id);
            } else {
              state.selected.push(idx.id);
            }
            buildChart();
            renderCards();
          };
          container.appendChild(card);
        });
      const title = document.getElementById('chart-title');
      title.textContent = state.selected.length
        ? `${state.selected.length} Indexe – Basis ${ranges.find(r => r.id === state.range)?.label || 'Max'}, ${state.scale === 'log' ? 'logarithmisch' : 'linear'}`
        : 'Bitte Index auswählen';
    }

    document.getElementById('search').addEventListener('input', (e) => {
      state.search = e.target.value;
      renderCards();
    });

    renderRanges();
    renderScales();
    renderRegions();
    renderCards();
    buildChart();
  </script>
</body>
</html>
