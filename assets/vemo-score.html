<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vemo 3a Fast Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --vemo-green: #76D062;
      --vemo-green-soft: #E9F9E4;
      --vemo-text: #0f172a;
      --vemo-ring: #d0d7e4;
      --vemo-muted: #64748b;
      --vemo-blue: #7DD3FC;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.10);
      --shadow-strong: 0 30px 60px rgba(15, 23, 42, 0.18);
      --radius-lg: 22px;
      --blur-glass: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(118, 208, 98, 0.12), transparent 32%),
        radial-gradient(circle at 85% 10%, rgba(125, 211, 252, 0.14), transparent 28%),
        linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--vemo-text);
      overflow-x: hidden;
    }

    .vemo-tool-wrapper {
      padding: 32px 24px 72px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .vemo-tool-card {
      width: 100%;
      max-width: 1180px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(208, 215, 228, 0.65);
      box-shadow: var(--shadow-strong);
      padding: 26px 28px 24px;
      backdrop-filter: blur(var(--blur-glass));
      position: relative;
      overflow: visible;
    }

    .vemo-tool-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 15%, rgba(118, 208, 98, 0.08), transparent 35%),
        radial-gradient(circle at 90% 5%, rgba(125, 211, 252, 0.12), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .vemo-tool-card > * { position: relative; z-index: 1; }

    #vemo-score, #vemo-score * {
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--vemo-text);
    }

    .shell { display: grid; gap: 16px; }

    .hdr {
      display: grid;
      gap: 10px;
      padding: 4px 2px 6px;
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--vemo-green-soft);
      color: #19532a;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
    }

    .eyebrow.float {
      position: absolute;
      top: 2px;
      right: 0;
      box-shadow: 0 10px 24px rgba(118,208,98,0.22);
    }

    .title { font-size: 28px; margin: 0; font-weight: 700; }
    .subtitle { margin: 0; color: var(--vemo-muted); font-size: 15px; }

    .wrap-card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--vemo-ring);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      overflow: visible;
    }

    .pbar {
      width: 100%;
      height: 12px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .pbar .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--vemo-green), #a2e58f);
      transition: width .25s ease;
    }

    .content { padding: 20px 22px; }
    .stack { display: grid; gap: 12px; }

    .option {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--vemo-ring);
      background: #fff;
      cursor: pointer;
      transition: all .18s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
    }
    .option .label { font-weight: 600; font-size: 15px; }
    .option small { color: var(--vemo-muted); font-size: 13px; }
    .option:hover { border-color: var(--vemo-green); box-shadow: 0 14px 30px rgba(118,208,98,0.16); transform: translateY(-1px); }
    .option[data-selected="true"] { background: linear-gradient(120deg, var(--vemo-green), #9ae38b); color: #fff; border-color: transparent; box-shadow: 0 16px 34px rgba(118,208,98,0.28); }
    .option[data-selected="true"] small { color: rgba(255,255,255,0.82); }

    .select, .input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--vemo-ring);
      background: #fff;
      font-size: 16px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .select:focus, .input:focus { outline: none; border-color: var(--vemo-green); box-shadow: 0 0 0 4px rgba(118,208,98,0.2); }

    .input[type="range"] {
      height: 36px;
      padding: 0;
      appearance: none;
      background: linear-gradient(90deg, var(--vemo-green) var(--val, 0%), #eef2f7 var(--val, 0%));
      border-radius: 999px;
      outline: none;
    }
    .input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--vemo-green);
      box-shadow: 0 2px 8px rgba(15,23,42,.15);
    }
    .input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--vemo-green);
      box-shadow: 0 2px 8px rgba(15,23,42,.15);
    }
    .input[disabled] { opacity: .5; pointer-events: none; filter: saturate(.2) contrast(.9); }

    .inline { display: flex; align-items: center; gap: 12px; }
    .unklar { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--vemo-muted); font-size: 14px; }

    .slider-meta { display: flex; align-items: center; gap: 10px; color: var(--vemo-muted); font-size: 14px; margin-top: 10px; }

    .info-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--vemo-blue);
      color: #0b1531;
      font-weight: 700;
      font-size: 12px;
      cursor: help;
      border: 1px solid rgba(12, 18, 34, 0.08);
      box-shadow: 0 6px 14px rgba(15,23,42,0.16);
    }

    .info-badge:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(125,211,252,0.35); }

    .info-badge::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: #0b1531;
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      box-shadow: var(--shadow-soft);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
      width: min(360px, calc(100vw - 32px));
      font-size: 13px;
      line-height: 1.45;
      z-index: 2;
      text-align: left;
      white-space: normal;
      word-break: break-word;
    }

    .info-badge::before {
      content: '';
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      border: 8px solid transparent;
      border-top-color: #0b1531;
      opacity: 0;
      transition: opacity .15s ease, transform .15s ease;
    }

    .info-badge:hover::after, .info-badge:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
    .info-badge:hover::before, .info-badge:focus-visible::before { opacity: 1; transform: translateX(-50%) translateY(0); }

    .header-row { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

    .btnrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 22px 20px; }

    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s ease;
    }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(118,208,98,.25); }
    .btn.primary { background: linear-gradient(120deg, var(--vemo-green), #9ae38b); color: #fff; border-color: var(--vemo-green); box-shadow: 0 14px 32px rgba(118,208,98,0.35); }
    .btn.primary:hover { transform: translateY(-1px); }
    .btn.primary[disabled] { background: #fff; color: var(--vemo-muted); border-color: var(--vemo-ring); box-shadow: none; cursor: not-allowed; }
    .btn.ghost { background: rgba(241,245,249,0.8); color: #0f172a; border: 1px solid var(--vemo-ring); box-shadow: 0 8px 18px rgba(15,23,42,0.08); }
    .btn.ghost:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(15,23,42,0.12); }

    .center { text-align: center; }

    .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0 4px; }
    .results-grid .panel { background: rgba(255,255,255,0.9); border: 1px solid var(--vemo-ring); border-radius: 18px; padding: 18px; box-shadow: var(--shadow-soft); }
    .results-grid .panel.full { grid-column: 1 / -1; }

    .gauge { position: relative; width: 100%; max-width: 260px; margin: 0 auto; aspect-ratio: 1; }
    .gauge .centered { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; }
    .score { font-size: 44px; font-weight: 800; }
    .verdict { font-weight: 700; font-size: 16px; color: var(--vemo-text); }

    .pill { background: var(--vemo-green-soft); border: 1px solid #cdeec4; color: #134e1f; padding: 12px 14px; border-radius: 12px; font-size: 13px; margin-top: 6px; }
    .pill.warn { background: #fff7ed; border-color: #ffedd5; color: #9a3412; }

    .note { color: var(--vemo-muted); font-size: 13px; text-align: center; margin: 0; }

    .axis-wrap { padding: 4px 0 6px; }
    .axis-list { display: grid; gap: 10px; }
    .axis-item { display: grid; grid-template-columns: 130px 1fr 52px; align-items: center; gap: 10px; }
    .axis-item .name { font-weight: 600; font-size: 13px; color: #475569; }
    .axis-item .bar { position: relative; height: 12px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 999px; overflow: hidden; }
    .axis-item .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, var(--vemo-green), #9ae38b); transition: width .3s ease; }
    .axis-item .val { font-size: 13px; text-align: right; color: #334155; font-weight: 700; }

    .sources-wrap { padding-top: 6px; }
    .sources-title { font-size: 13px; letter-spacing: .02em; color: #64748b; margin: 0 0 10px 0; font-weight: 700; text-transform: uppercase; }
    .sources { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 10px; }
    .src { display: flex; align-items: center; justify-content: center; background: #fafcff; border: 1px solid rgba(15,23,42,.08); border-radius: 12px; padding: 12px 14px; font-weight: 600; text-decoration: none; color: var(--vemo-text); cursor: pointer; transition: all .15s ease; }
    .src:hover { background: #f8fff6; border-color: var(--vemo-green); box-shadow: 0 4px 10px rgba(118,208,98,.12); transform: translateY(-1px); }

    .err { padding: 16px; color: #9a3412; background: #fff7ed; border: 1px solid #ffedd5; border-radius: 12px; white-space: pre-wrap; }

    @media (max-width: 960px) {
      .results-grid { grid-template-columns: 1fr; }
      .axis-item { grid-template-columns: 1fr; align-items: flex-start; }
      .axis-item .val { text-align: left; }
    }

    @media (max-width: 768px) {
      .vemo-tool-wrapper { padding: 12px; }
      .vemo-tool-card { padding: 18px 16px 20px; border-radius: 18px; }
      .title { font-size: 24px; }
      .btnrow { flex-direction: column; }
      .btnrow .btn { width: 100%; }
      .option { padding: 12px 14px; }
    }

    @media (max-width: 520px) {
      .hdr { text-align: left; }
      .gauge { max-width: 220px; }
      .btnrow { padding: 0 12px 16px; }
      .content { padding: 16px 18px; }
    }
  </style>
</head>
<body>
  <div class="vemo-tool-wrapper">
    <div class="vemo-tool-card">
      <div id="vemo-score"></div>
    </div>
  </div>
  <script>
    (function(){
      function fail(msg){
        try{
          var m=document.getElementById('vemo-score');
          if(m){
            m.innerHTML='';
            var w=document.createElement('div');
            w.className='wrap-card content';
            var e=document.createElement('div');
            e.className='err';
            e.textContent=msg;
            w.appendChild(e);
            m.appendChild(w);
          }
        }catch(_){/* noop */}
      }
      try{
        'use strict';
        var mount=document.getElementById('vemo-score');
        var WEIGHTS={ structure:0.20, costs:0.30, investment:0.25, transparency:0.15, flexibility:0.10 };
        var STORAGE_KEY='vemo-3a-fast-check';
        var MAX_3A_ANNUAL=7258; // Aktueller Maximalbetrag Schweiz
        var MAX_3A_MONTHLY=Math.round((MAX_3A_ANNUAL/12)*100)/100; // Monatsmaximum (präziser gerundet)

        function restoreState(){
          try{
            var raw=localStorage.getItem(STORAGE_KEY);
            if(!raw) return null;
            var parsed=JSON.parse(raw);
            if(parsed && typeof parsed==='object'){
              return {
                step: typeof parsed.step==='number'?parsed.step:0,
                a: parsed.a && typeof parsed.a==='object'?parsed.a:{},
                show: !!parsed.show,
                details: !!parsed.details
              };
            }
          }catch(_){}
          return null;
        }

        var state=restoreState() || { step:0, a:{}, show:false, details:false };

        function persistState(){
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(_){/* ignore quota */}
        }

        function h(tag, attrs){
          var n=document.createElement(tag);
          if(attrs){
            for(var k in attrs){
              if(!Object.prototype.hasOwnProperty.call(attrs,k)) continue;
              var v=attrs[k];
              if(v===null||v===undefined) continue;
              if(k==='class'){ n.className=v; }
              else if(k==='style'){ n.setAttribute('style', v); }
              else if(k==='disabled'){ if(v){ n.setAttribute('disabled',''); } }
              else { n.setAttribute(k, String(v)); }
            }
          }
          for(var i=2;i<arguments.length;i++){
            var c=arguments[i];
            if(c===null||c===undefined) continue;
            var type=typeof c;
            if(type==='string' || type==='number' || type==='boolean'){
              n.appendChild(document.createTextNode(String(c)));
            } else {
              n.appendChild(c);
            }
          }
          return n;
        }

        function updateAndRender(fn){
          if(typeof fn==='function') fn();
          persistState();
          render();
        }

        function gauge(val,color,emoji){
          var r=40; var c=2*Math.PI*r; var dash=(c*Math.max(0,Math.min(100,val)))/100;
          var wrap=h('div',{class:'gauge'}); var NS='http://www.w3.org/2000/svg';
          var svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 100 100'); svg.style.transform='rotate(-90deg)'; svg.style.width='100%'; svg.style.height='100%';
          var bg=document.createElementNS(NS,'circle'); bg.setAttribute('cx','50'); bg.setAttribute('cy','50'); bg.setAttribute('r',String(r)); bg.setAttribute('fill','none'); bg.setAttribute('stroke','#e5e7eb'); bg.setAttribute('stroke-width','8');
          var fg=document.createElementNS(NS,'circle'); fg.setAttribute('cx','50'); fg.setAttribute('cy','50'); fg.setAttribute('r',String(r)); fg.setAttribute('fill','none'); fg.setAttribute('stroke',color); fg.setAttribute('stroke-width','8'); fg.setAttribute('stroke-linecap','round'); fg.setAttribute('stroke-dasharray', dash+' '+c);
          svg.appendChild(bg); svg.appendChild(fg);
          var center=h('div',{class:'centered'}, h('div',{class:'score',style:'color:'+color}, String(Math.round(val))), h('div',{class:'verdict'},emoji));
          wrap.appendChild(svg); wrap.appendChild(center); return wrap;
        }

        function clamp(x){ return Math.max(0,Math.min(100,x)); }
        function isNum(v){ return typeof v==='number' && !Number.isNaN(v); }

        function steps(){
          var a=state.a; var arr=[];
          var maxMonthlyLabel=MAX_3A_MONTHLY.toLocaleString('de-CH',{maximumFractionDigits:2, minimumFractionDigits:0});
          arr.push({ id:'provider', type:'single', title:'Bei welcher Gesellschaft befindet sich deine 3a-Lösung', options:[{value:'bank',label:'Banklösung',sub:'Depot oder Säule 3a Konto'},{value:'insurance',label:'Versicherung',sub:'Policengebundene 3a-Lösung'}] });
          arr.push({ id:'duration', type:'dropdown', title:'Wie viele Jahre läuft deine Lösung noch', options:durationOptions() });
          arr.push({ id:'monthly_contribution', type:'slider', title:'Wie viel zahlst du pro Monat ein (max. CHF '+maxMonthlyLabel+')', slider:{min:0,max:MAX_3A_MONTHLY,step:1,unit:'',format:'chf',decimals:0,default:MAX_3A_MONTHLY}, info:'Für die Säule 3a (Angestellte) gilt aktuell ein Maximalbetrag von CHF '+MAX_3A_ANNUAL.toLocaleString('de-CH')+' pro Jahr bzw. CHF '+maxMonthlyLabel+' pro Monat.' });
          arr.push({ id:'invest_eq', type:'slider', title:'Wie stark ist dein Guthaben in Aktienfonds investiert', slider:{min:0,max:99,step:0.1,unit:'%'} });
          if(isNum(a.invest_eq) && a.invest_eq<99){
            arr.push({ id:'rest_bucket', type:'single', title:'Wohin fliesst der Restanteil, der nicht investiert ist', options:[{value:'bonds',label:'Obligationen'},{value:'tech_rate',label:'Technischer Zins'},{value:'cash',label:'Geldkonto / Währung'}] });
          }
          if(isNum(a.invest_eq) && a.invest_eq>=80){
            arr.push({ id:'investment_approach', type:'single', title:'Investment-Ansatz', options:[{value:'passive',label:'Passiver Ansatz'},{value:'trend',label:'Trendfonds / Themenfonds'},{value:'none',label:'Keine Strategie'},{value:'unknown',label:'Unklar'}] });
          }
          arr.push({ id:'ter', type:'slider', title:'TER deiner Fonds', slider:{min:0,max:4,step:0.1,unit:'%'}, info:'Die TER findest du im Fonds-Factsheet. Sie wird oft als "Total Expense Ratio" oder Gesamtkostenquote ausgewiesen.' });
          arr.push({ id:'redemption_commission_pct', type:'slider', title:'Rücknahmekommissionen', slider:{min:0,max:10,step:0.1,unit:'%'}, info:'Rücknahmekommissionen stehen im KIID/PRIIP KID des Fonds unter Kosten oder im Factsheet bei Rückgabe- bzw. Verkaufsgebühren.' });
          arr.push({ id:'front_load_pct', type:'slider', title:'Ausgabeaufschlag', slider:{min:0,max:10,step:0.1,unit:'%'}, info:'Ausgabeaufschlag (Agio) wird im KIID/PRIIP KID im Abschnitt Kosten oder Vertriebsgebühren genannt.' });
          if(a.provider==='insurance'){
            arr.push({ id:'ins_services', type:'multiple', title:'Welche Versicherungsleistungen sind in der Police enthalten', options:[{value:'death_benefit',label:'Todesfallkapital'},{value:'disability_pension',label:'Erwerbsunfähigkeitsrente'},{value:'premium_waiver',label:'Prämienbefreiung'},{value:'none',label:'Keine'}] });
            arr.push({ id:'commission_transparency', type:'single', title:'Provision offengelegt', options:[{value:'yes',label:'Ja'},{value:'no',label:'Nein'},{value:'unknown',label:'Unklar'}] });
          }
          return arr;
        }

        function sliderUI(q,key){
          var val=state.a[key]; var isUnknown=(val==='unknown');
          var defaultVal=typeof q.slider.default==='number'?q.slider.default:q.slider.min;
          var num=isNum(val)?val:defaultVal;
          if(val===undefined){ state.a[key]=defaultVal; num=defaultVal; }
          var decimals=typeof q.slider.decimals==='number'?q.slider.decimals:1;
          function fmt(v){
            if(q.slider.format==='chf'){
              return 'CHF '+Number(v).toLocaleString('de-CH', {maximumFractionDigits:decimals, minimumFractionDigits:decimals});
            }
            return parseFloat(v).toFixed(decimals)+(q.slider.unit||'');
          }
          var slider=h('input',{class:'input',type:'range',min:q.slider.min,max:q.slider.max,step:q.slider.step,value:num});
          slider.style.setProperty('--val', ((num - q.slider.min)/(q.slider.max - q.slider.min))*100 + '%');
          var label=h('div',{}, isUnknown?'Unklar':fmt(num));
          var info=null;
          if(q.info){ info=h('button',{class:'info-badge','data-tip':q.info,type:'button','aria-label':'Info zu Gebühren'},'i'); }
          var row=h('div',{class:'inline'}, slider);
          var meta=h('div',{class:'slider-meta'}, label);
          if(info){ meta.appendChild(info); }
          var unklar=h('label',{class:'unklar'}, h('input',{type:'checkbox'}), h('span',{},'Unklar'));
          var chk=unklar.querySelector('input'); chk.checked=isUnknown;
          function apply(){ if(chk.checked){ slider.setAttribute('disabled',''); label.textContent='Unklar'; } else { slider.removeAttribute('disabled'); label.textContent=fmt(slider.value); } }
          apply();
          slider.addEventListener('input', function(e){ var v=parseFloat(e.target.value); state.a[key]=v; slider.style.setProperty('--val', ((v - q.slider.min)/(q.slider.max - q.slider.min))*100 + '%'); if(!chk.checked){ label.textContent=fmt(v); } });
          slider.addEventListener('change', function(){ if(!chk.checked){ state.a[key]=parseFloat(slider.value); } updateAndRender(); });
          chk.addEventListener('change', function(){ state.a[key]=chk.checked?'unknown':parseFloat(slider.value); apply(); updateAndRender(); });
          var wrap=h('div',{}); wrap.appendChild(row); wrap.appendChild(meta); wrap.appendChild(unklar); return wrap;
        }

        function score(){
          var a=state.a;
          var structure=75, costs=85, transparency=60, flexibility=80, investment=30;
          if(a.provider==='insurance'){ structure=60; costs=70; transparency=55; flexibility=60; investment=30; }
          if(isNum(a.invest_eq)){
            var investMax=90; var eq=a.invest_eq; var inv=(eq/99)*investMax;
            if(eq<99 && a.rest_bucket){ var rest=99 - eq; if(a.rest_bucket==='bonds') inv -= rest*(investMax/99)*0.15; if(a.rest_bucket==='tech_rate') inv -= rest*(investMax/99)*0.35; if(a.rest_bucket==='cash') inv -= rest*(investMax/99)*0.50; }
            if(eq>=80){ if(a.investment_approach==='passive'){ if(eq>=99) inv=investMax; } else if(a.investment_approach==='trend'){ inv -= 30; } else if(a.investment_approach==='none'){ inv -= 40; } else if(a.investment_approach==='unknown'){ inv -= 35; } }
            investment=clamp(Math.round(inv));
          } else if(a.invest_eq==='unknown'){ transparency-=20; }
          if(isNum(a.invest_eq) && a.invest_eq>=80){ if(a.investment_approach==='passive'){ structure+=5; transparency+=5; } else if(a.investment_approach==='trend'){ structure-=8; transparency-=5; } else if(a.investment_approach==='none'){ structure-=12; transparency-=8; } else if(a.investment_approach==='unknown'){ transparency-=15; } }
          if(isNum(a.ter)){ costs -= a.ter*20; } else if(a.ter==='unknown'){ costs -= 10; transparency -= 15; }
          if(isNum(a.redemption_commission_pct)) costs -= a.redemption_commission_pct*2; else if(a.redemption_commission_pct==='unknown'){ costs -= 10; transparency -= 10; }
          if(isNum(a.front_load_pct)) costs -= a.front_load_pct*2; else if(a.front_load_pct==='unknown'){ costs -= 10; transparency -= 10; }
          if(a.provider==='insurance'){
            var s=Array.isArray(a.ins_services)?a.ins_services:[];
            if(s.indexOf('death_benefit')>-1) structure-=8;
            if(s.indexOf('disability_pension')>-1) structure-=8;
            if(s.indexOf('premium_waiver')>-1) structure-=3;
            if(a.commission_transparency==='yes') transparency+=15; else if(a.commission_transparency==='no') transparency-=15; else if(a.commission_transparency==='unknown') transparency-=10;
          }
          structure=clamp(Math.round(structure)); costs=clamp(Math.round(costs)); investment=clamp(Math.round(investment)); transparency=clamp(Math.round(transparency)); flexibility=clamp(Math.round(flexibility));
          var total=Math.round(structure*WEIGHTS.structure + costs*WEIGHTS.costs + investment*WEIGHTS.investment + transparency*WEIGHTS.transparency + flexibility*WEIGHTS.flexibility);
          var stroke='#76D062', emoji='✅', verdict='Sehr gut';
          if(total<50){ stroke='#ef4444'; emoji='❌'; verdict='Verbesserungsbedarf'; }
          else if(total<80){ stroke='#f97316'; emoji='⚠️'; verdict='Durchschnittlich'; }
          return { total:total, stroke:stroke, emoji:emoji, verdict:verdict, axes:{structure:structure,costs:costs,investment:investment,transparency:transparency,flexibility:flexibility}, tips:buildTips(a) };
        }

        function buildTips(a){
          var warns=[], positives=[];
          if(a.provider==='bank'){ positives.push('Bank in Ordnung. Meist günstiger als Versicherung, aber laufende Kosten wie Depot und TER prüfen.'); }
          if(a.provider==='insurance'){
            warns.push('Achtung: Versicherungsverträge sind oft intransparent und verursachen sehr hohe laufende Kosten beim Besparen.');
            var s=Array.isArray(a.ins_services)?a.ins_services:[];
            if(s.indexOf('none')>-1) warns.push('Achtung: Keine Versicherungsdeckung gewählt. Eine Versicherungslösung macht in diesem Fall keinen Sinn.');
          }
          if((a.duration==='1-5'||a.duration==='6-10'||a.duration==='11-15') && isNum(a.invest_eq) && a.invest_eq>80){ warns.push('Warnhinweis 88: Hoher Aktienanteil bei kurzer Restlaufzeit kann riskant sein - dringende Überprüfung.'); }
          if(isNum(a.ter) && a.ter>0.5){ warns.push('Achtung: TER über 0.5 Prozent. Möglich aktiver Fonds mit hohen Kosten.'); }
          if(a.ter==='unknown') warns.push('Achtung: TER unbekannt. Factsheet prüfen - hohe Kosten führen zu weniger Rendite.');
          if(a.invest_eq==='unknown') warns.push('Achtung: Investmentquote unbekannt - hier fehlt Wissen.');
          if(a.redemption_commission_pct==='unknown') warns.push('Achtung: Rücknahmekommission nicht bekannt - kann viel ausmachen.');
          if(a.front_load_pct==='unknown') warns.push('Achtung: Ausgabeaufschlag nicht bekannt - kann viel ausmachen.');
          if(isNum(a.invest_eq) && a.invest_eq<99){ if(a.rest_bucket==='tech_rate') warns.push('Achtung: Technischer Zins senkt die Rendite oft massiv.'); if(a.rest_bucket==='cash') warns.push('Achtung: Nicht investierter Anteil auf dem Geldkonto senkt die Rendite und ist der Inflation ausgesetzt.'); }
          if(isNum(a.invest_eq) && a.invest_eq>=80){ if(a.investment_approach==='passive') positives.push('Passiver Ansatz gewählt - gut für Kosten und Marktabdeckung.'); if(a.investment_approach==='trend') warns.push('Achtung: Trend- oder Themenfonds bergen Risiken und oft höhere Kosten; statistisch erzielen sie langfristig häufig schlechtere Renditen.'); if(a.investment_approach==='none') warns.push('Achtung: Keine Strategie führt oft zu einer schlechteren Rendite.'); if(a.investment_approach==='unknown') warns.push('Achtung: Strategie unbekannt.'); }
          return { warns:warns, positives:positives };
        }

        function durationOptions(){
          var arr=[];
          for(var y=5; y<=45; y++){
            arr.push({ value:String(y), label: y+' Jahre' });
          }
          return arr;
        }

        function durationYears(key){
          var num=parseInt(key, 10);
          if(Number.isNaN(num) || num<1) return null;
          return num;
        }

        function equityRate(eq){
          if(!isNum(eq)) return null;
          var ratio=Math.max(0, Math.min(1, eq/99));
          return 0.073 * ratio; // 7.3% maximale Annahme bei 100% Aktienanteil
        }

        function feeAssumption(a){
          var ter=isNum(a.ter)?a.ter:(a.ter==='unknown'?1.2:0);
          var front=isNum(a.front_load_pct)?a.front_load_pct:(a.front_load_pct==='unknown'?1:0);
          var redemption=isNum(a.redemption_commission_pct)?a.redemption_commission_pct:(a.redemption_commission_pct==='unknown'?1:0);
          var total=ter+front+redemption;
          return {
            runningPct:ter/100,
            frontLoadPct:front/100,
            redemptionPct:redemption/100,
            totalDisplay:(Math.round(total*10)/10).toFixed(1)+'%'
          };
        }

        function futureValueMonthly(payment, years, annualRate){
          var months=years*12; var r=annualRate/12;
          if(!r){ return payment*months; }
          return payment*((Math.pow(1+r, months)-1)/r);
        }

        function formatCHF(val){
          return 'CHF '+Math.round(val).toLocaleString('de-CH');
        }

        function buildProjection(a){
          var years=durationYears(a.duration);
          if(!years || !isNum(a.monthly_contribution)) return null;
          var baseRate=equityRate(a.invest_eq);
          if(baseRate===null) return null;
          if(a.investment_approach && a.investment_approach!=='passive'){
            baseRate=Math.max(baseRate - 0.01, 0);
          }
          var monthly=a.monthly_contribution;
          if(a.provider==='insurance'){ monthly = monthly*0.95; }
          var fee=feeAssumption(a);
          var zeroFees = fee.runningPct===0 && fee.frontLoadPct===0 && fee.redemptionPct===0;
          var growthRate=Math.max(baseRate - fee.runningPct, 0);
          var withBase=futureValueMonthly(monthly, years, baseRate);
          var withFees=futureValueMonthly(monthly*(1-fee.frontLoadPct), years, growthRate);
          withFees = withFees * (1 - fee.redemptionPct);
          var paidIn=monthly*12*years;
          var diff=withBase - withFees;
          var maxRate=0.073;
          var fullEquity=futureValueMonthly(monthly, years, maxRate);
          var equityGap=Math.max(0, fullEquity - withBase);
          return {
            years:years,
            monthly:monthly,
            paidIn:paidIn,
            baseRate:baseRate,
            netRate:growthRate,
            fee:fee,
            withBase:withBase,
            withFees:withFees,
            diff:diff,
            zeroFees:zeroFees,
            equityGap:equityGap
          };
        }

        function axisUI(axes){
          var wrap=h('div',{class:'axis-wrap'}, h('div',{class:'axis-list'}));
          var list=wrap.firstChild;
          var items=[['Struktur','structure'],['Kosten','costs'],['Investment','investment'],['Transparenz','transparency'],['Flexibilität','flexibility']];
          for(var i=0;i<items.length;i++){
            var label=items[i][0], key=items[i][1];
            var row=h('div',{class:'axis-item'}, h('div',{class:'name'},label), h('div',{class:'bar'}, h('div',{class:'fill'})), h('div',{class:'val'}, String(Math.round(axes[key]))));
            row.querySelector('.fill').style.width=axes[key]+'%';
            list.appendChild(row);
          }
          return wrap;
        }

        function projectionUI(p){
          var basePct=(p.baseRate*100).toFixed(1)+'%';
          var netPct=(p.netRate*100).toFixed(1)+'%';
          var diffAbs=Math.abs(p.diff);
          var diffLow=diffAbs*0.9;
          var diffHigh=diffAbs*1.1;
          var diffRange=h('span',{style:'color: var(--vemo-green); font-weight:800;'}, formatCHF(diffLow)+' bis '+formatCHF(diffHigh));
          var zeroFeeWarn = p.zeroFees ? h('div',{class:'pill warn',style:'margin-top:10px;'},'Achtung: Eine 3a-Lösung ohne Gebühren ist unrealistisch – bitte prüfe deine Angaben.') : null;
          var equityNote=null;
          if(p.equityGap>0 && p.baseRate < 0.05 && p.years>=10){
            var lossLow=p.equityGap*0.9;
            var lossHigh=p.equityGap*1.1;
            equityNote=h('div',{class:'pill warn',style:'margin-top:10px;'},'Achtung: Durch die tiefe Aktienquote könnten etwa ', h('span',{style:'color: var(--vemo-green); font-weight:800;'}, formatCHF(lossLow)+' bis '+formatCHF(lossHigh)), ' weniger zusammenkommen.');
          }
          return h('div',{class:'panel full'},
            h('h3',{style:'margin:0 0 10px;font-size:16px;'},'Gebühren-Effekt bei deiner Laufzeit'),
            h('p',{class:'subtitle',style:'margin:0 0 12px;font-size:14px; line-height:1.6;'},
              'Bei ', formatCHF(p.monthly),' monatlicher Einzahlung über ',p.years,' Jahre mit einer Brutto-Renditeannahme von ',basePct,
              ' (netto ca. ',netPct,') rechnen wir mit geschätzten Gebühren. Laut dieser Annahme könnten die Gebühren etwa ', diffRange,
              ' Unterschied ausmachen. Hol dir eine zweite Meinung.'
            ),
            zeroFeeWarn,
            equityNote
          );
        }

        function sourcesUI(){
          var wrap=h('div',{class:'sources-wrap'});
          wrap.appendChild(h('h4',{class:'sources-title'},'Quellen'));
          var grid=h('div',{class:'sources'});
          grid.appendChild(h('a',{class:'src', href:'https://www.spglobal.com/spdji/en/research-insights/spiva/', target:'_blank', rel:'noopener'}, 'SPIVA'));
          grid.appendChild(h('a',{class:'src', href:'https://www.youtube.com/watch?v=ikx_T3VpIqo', target:'_blank', rel:'noopener'}, 'Kassensturz'));
          grid.appendChild(h('a',{class:'src', href:'https://www.ubs.com/global/en/investment-bank/insights-and-data/2025/global-investment-returns-yearbook-2025/_jcr_content/root/contentarea/mainpar/toplevelgrid_copy/col_1/innergrid_copy/col_2/actionbutton.0813156672.file/PS9jb250ZW50L2RhbS9hc3NldHMvd20vc3RhdGljL2Npby9kb2N1bWVudHMvZ2lyeS0yMDI1LXN1bW1hcnktcHVibGljLnBkZg==/giry-2025-summary-public.pdf', target:'_blank', rel:'noopener'}, 'UBS Yearbook'));
          wrap.appendChild(grid);
          return wrap;
        }

        function render(){
          mount.innerHTML='';
          var shell=h('div',{class:'shell'});
          mount.appendChild(shell);

          var seq=steps();
          if(state.step>=seq.length){ state.step=Math.max(0, seq.length-1); }
          if(state.show){
            var r=score();
            var header=h('div',{class:'hdr'},
              h('div',{class:'eyebrow float'},'Vemo 3a Fast Check'),
              h('div',{class:'header-row'},
                h('div',{}, h('h2',{class:'title'},'Dein Vemo Score'), h('p',{class:'subtitle'},'Basierend auf Struktur, Kosten, Investment, Transparenz und Flexibilität'))
              )
            );
            var results=h('div',{class:'results-grid'});
            var gaugePanel=h('div',{class:'panel center'}, gauge(r.total,r.stroke,r.emoji), h('div',{class:'verdict'}, r.verdict));
            var axesPanel=h('div',{class:'panel'}, h('h3',{style:'margin:0 0 12px;font-size:16px;'},'Score nach Kategorien'), axisUI(r.axes));
            results.appendChild(gaugePanel); results.appendChild(axesPanel);
            var proj=buildProjection(state.a);
            if(proj){ results.appendChild(projectionUI(proj)); }

            var t=r.tips; var details=h('div',{class:'content stack'});
            if(state.details){
              if(t.warns.length){ var w=h('div',{}); w.appendChild(h('h3',{},'Warnsignale')); for(var wi=0; wi<t.warns.length; wi++){ w.appendChild(h('div',{class:'pill warn'}, t.warns[wi])); } details.appendChild(w); }
              if(t.positives.length){ var p=h('div',{}); p.appendChild(h('h3',{},'Positive Signale')); for(var pi=0; pi<t.positives.length; pi++){ p.appendChild(h('div',{class:'pill'}, t.positives[pi])); } details.appendChild(p); }
            }
            var toggle=h('div',{class:'content center',style:'padding-top:0;'}, h('button',{class:'btn ghost'}, state.details?'Details ausblenden':'Details anzeigen'));
            toggle.querySelector('button').addEventListener('click', function(){ updateAndRender(function(){ state.details=!state.details; }); });
            var foot=h('div',{class:'content',style:'border-top:1px solid var(--vemo-ring); display:grid; gap:10px;'}, h('button',{class:'btn primary',style:'width:100%;'},'Neue Analyse starten'), h('p',{class:'note'},'Alle Angaben ohne Gewähr und ersetzen keine individuelle Beratung'));
            foot.querySelector('button').addEventListener('click', function(){ updateAndRender(function(){ state.step=0; state.a={}; state.show=false; state.details=false; }); });
            shell.appendChild(header); shell.appendChild(results); if(state.details){ shell.appendChild(details); } shell.appendChild(toggle); shell.appendChild(sourcesUI()); shell.appendChild(foot); return;
          }

          var stepObj=seq[state.step] || seq[0];
          var pct=Math.round(((Math.min(state.step+1,seq.length))/Math.max(1,seq.length))*100);
          var fill=h('div',{class:'fill'});
          var header2=h('div',{class:'hdr'},
            h('div',{class:'eyebrow float'},'Vemo 3a Fast Check'),
            h('div',{class:'header-row'},
              h('div',{}, h('div',{class:'pbar'}, fill), h('h2',{class:'title'}, stepObj.title), h('p',{class:'subtitle'},'Beantworte kurz die Fragen und erhalte einen Score.'))
            )
          );
          fill.style.width=pct+'%';

          var body=h('div',{class:'content stack wrap-card'});
          var ans=state.a[stepObj.id];
          if(stepObj.type==='single'){
            var opts=(stepObj.options||[]);
            for(var oi=0; oi<opts.length; oi++){
              (function(opt){
                var selected=ans===opt.value;
                var inner=h('div',{}, h('div',{class:'label'},opt.label), opt.sub?h('small',{},opt.sub):null);
                var b=h('button',{class:'option','data-selected':selected?'true':'false'}, inner, selected?h('span',{},'✓'):h('span',{},''));
                b.addEventListener('click', function(){ updateAndRender(function(){ state.a[stepObj.id]=opt.value; var s=steps(); state.step=Math.min(state.step+1, s.length-1); }); });
                body.appendChild(b);
              })(opts[oi]);
            }
          } else if(stepObj.type==='multiple'){
            var sel=Array.isArray(ans)?ans:[]; var opts2=(stepObj.options||[]);
            for(var mi=0; mi<opts2.length; mi++){
              (function(opt){
                var on=sel.indexOf(opt.value)>-1;
                var b=h('button',{class:'option','data-selected':on?'true':'false'}, h('div',{class:'label'},opt.label));
                b.addEventListener('click', function(){ updateAndRender(function(){ var next=sel.slice(); if(on){ next=next.filter(function(v){ return v!==opt.value; }); } else { if(opt.value==='none'){ next=['none']; } else { next=next.filter(function(v){ return v!=='none'; }).concat(opt.value); } } state.a[stepObj.id]=next; }); });
                body.appendChild(b);
              })(opts2[mi]);
            }
          } else if(stepObj.type==='dropdown'){
            var sEl=h('select',{class:'select'}); sEl.appendChild(h('option',{value:''},'Bitte auswählen'));
            var optz=stepObj.options; for(var di=0; di<optz.length; di++){ sEl.appendChild(h('option',{value:optz[di].value}, optz[di].label)); }
            sEl.value=(ans||''); sEl.addEventListener('change', function(e){ updateAndRender(function(){ state.a[stepObj.id]=e.target.value; }); }); body.appendChild(sEl);
          } else if(stepObj.type==='slider'){
            body.appendChild(sliderUI(stepObj, stepObj.id));
          }

          var cur = state.a[stepObj.id];
          var canNext = stepObj.type==='multiple' ? (Array.isArray(cur)&&cur.length>0) : (stepObj.type==='slider' ? (cur==='unknown' || isNum(cur)) : !!cur);
          var actions=h('div',{class:'btnrow'}, h('button',{class:'btn ghost', disabled: state.step===0}, 'Zurück'), h('button',{class:'btn primary', disabled: !canNext}, state.step>=seq.length-1?'Ergebnis anzeigen':'Weiter'));
          actions.children[0].addEventListener('click', function(){ if(state.step>0){ updateAndRender(function(){ state.step--; }); } });
          actions.children[1].addEventListener('click', function(){ var seqNow=steps(); if(state.step<seqNow.length-1){ updateAndRender(function(){ state.step++; }); } else { updateAndRender(function(){ state.show=true; }); } });

          shell.appendChild(header2); shell.appendChild(body); shell.appendChild(actions);
          persistState();
        }

        if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', render); } else { render(); }
      } catch(e){ fail('SyntaxError: '+(e&&e.message?e.message:String(e))); }
    })();
  </script>
</body>
