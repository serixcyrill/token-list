<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanzielle Freiheit – Vemo Style Rechner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f8fb;
      --card:#ffffff;
      --muted:#6b7280;
      --muted-2:#94a3b8;
      --accent:#7ed957;
      --accent-2:#5b7cfa;
      --ring:rgba(17,24,39,.08);
      --ring-strong:rgba(126,217,87,.35);
      --glass:rgba(255,255,255,.52);
      --panel:rgba(255,255,255,.62);
      --radius:18px;
      --shadow:0 18px 40px rgba(15,23,42,.10);
    }

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 16% 24%, rgba(126,217,87,.10), transparent 26%),
        radial-gradient(circle at 86% 16%, rgba(91,124,250,.10), transparent 24%),
        linear-gradient(180deg,#fbfcff 0%, #eef2ff 100%);
    }

    #freiheit *,
    #freiheit *::before,
    #freiheit *::after{ box-sizing:border-box; }

    #freiheit{
      color:#0f172a;
      font-family:'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
      padding:28px 16px 60px;
      background:transparent;
      position:relative;
      isolation:isolate;
    }

    #freiheit .app{
      max-width:1120px;
      margin:0 auto;
      position:relative;
    }
    #freiheit .orb{
      position:absolute;
      inset:0;
      filter:blur(90px);
      opacity:0;
      background:none;
      z-index:0;
      pointer-events:none;
    }
    #freiheit .shell{
      position:relative; z-index:1;
      background:var(--glass);
      border:1px solid var(--ring);
      border-radius:26px;
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(10px);
    }

    #freiheit header{
      padding:14px 20px 8px;
      border-bottom:1px solid var(--ring);
      display:flex;
      flex-wrap:wrap;
      gap:8px 12px;
      align-items:flex-start;
      justify-content:space-between;
      background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 70%);
    }
    #freiheit .head-left{ display:flex; flex-direction:column; gap:2px; }
    #freiheit .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 11px;
      background:rgba(248,250,252,.85);
      border:1px solid var(--ring);
      border-radius:999px;
      color:#0f172a;
      font-weight:700;
      font-size:11px;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    #freiheit .dot{ width:8px; height:8px; border-radius:99px; background:var(--accent); box-shadow:none; }
    #freiheit h1{
      margin:0;
      font-size:30px;
      font-family:'Space Grotesk', 'Inter', system-ui;
      font-weight:800;
      letter-spacing:-0.25px;
      color:#0f172a;
    }

    #freiheit .save-meta{
      color:#475569;
      font-weight:600;
      font-size:13px;
      background:rgba(255,255,255,.6);
      border:1px solid var(--ring);
      padding:8px 10px;
      border-radius:12px;
      box-shadow:0 8px 20px rgba(15,23,42,.06);
    }

    #freiheit main{ padding:24px 28px 36px; }
    #freiheit .grid{
      display:grid;
      gap:20px;
    }
    @media (min-width: 960px){
      #freiheit .grid.cols-2{ grid-template-columns:1.05fr 0.95fr; align-items:stretch; }
    }

    #freiheit .panel{
      background:var(--panel);
      border:1px solid var(--ring);
      border-radius:22px;
      padding:22px;
      box-shadow:0 14px 32px rgba(15,23,42,.08);
      display:flex;
      flex-direction:column;
      height:100%;
    }

    #freiheit .form-grid{ display:grid; gap:18px; }
    @media (min-width: 640px){ #freiheit .form-grid.cols-2{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

    #freiheit label{
      font-weight:700;
      color:#0f172a;
      display:flex;
      justify-content:space-between;
      font-size:14px;
      margin-bottom:6px;
    }
    #freiheit .hint{ color:var(--muted); font-weight:600; font-size:12px; }

    #freiheit .input, #freiheit select.input{
      width:100%;
      border:1px solid var(--ring);
      background:rgba(248,250,252,.56);
      color:#0f172a;
      font-size:15px;
      padding:14px 16px;
      border-radius:14px;
      outline:none;
      transition: border-color .2s ease, box-shadow .2s ease, transform .12s ease, background-color .2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
    }
    #freiheit .input:focus{ border-color:var(--ring-strong); box-shadow:0 0 0 4px rgba(126,217,87,.15); background:rgba(255,255,255,.78); }
    #freiheit .input:active{ transform:translateY(1px); }

    #freiheit .input-wrap{ position:relative; }
    #freiheit .suffix{
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      color:var(--muted); font-size:12px; font-weight:700; letter-spacing:0.1px;
    }
    #freiheit select.input{ appearance:none; cursor:pointer; padding-right:48px; background-image:url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5' stroke='%239fb3d0' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 14px center; }

    #freiheit .steps{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    #freiheit .pill{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--ring);
      background:rgba(248,250,252,.72);
      font-weight:700;
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:#0f172a;
      box-shadow:0 8px 18px rgba(15,23,42,.06);
    }
    #freiheit .pill .index{
      width:26px; height:26px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      background:rgba(91,124,250,.14);
      color:#1e293b; font-weight:800; font-size:13px;
    }

    #freiheit .kpis{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-top:18px; align-items:stretch; }
    #freiheit .kpi{
      background:var(--panel);
      border:1px solid var(--ring);
      border-radius:14px;
      padding:14px 16px 12px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-height:92px;
      box-shadow:0 12px 28px rgba(15,23,42,.06);
    }
    #freiheit .kpi-label{ color:var(--muted); font-size:13px; }
    #freiheit .kpi-value{ font-size:22px; font-weight:800; letter-spacing:-0.2px; margin-top:4px; color:#0f172a; transition:color .2s ease; }

    #freiheit .kpi.endcap{
      grid-column:1 / -1;
      flex-direction:row;
      align-items:center;
      gap:12px;
      padding:18px 22px;
      min-height:120px;
      background:linear-gradient(180deg,rgba(243,246,255,.64) 0%, rgba(255,255,255,.56) 90%);
      border:1px solid rgba(91,124,250,.14);
      box-shadow:0 18px 36px rgba(91,124,250,.08);
    }
    #freiheit .kpi.endcap .kpi-label{ font-size:14px; color:#0f172a; letter-spacing:0; }
    #freiheit .kpi.endcap .kpi-value{ font-size:30px; color:#0f172a; }

    #freiheit .kpi.accent{
      background:linear-gradient(180deg,rgba(126,217,87,.12) 0%, rgba(126,217,87,.06) 70%);
      border-color:rgba(126,217,87,.30);
      box-shadow:0 18px 34px rgba(126,217,87,.08);
    }
    #freiheit .kpi.accent .kpi-label{ color:#0f172a; }
    #freiheit .kpi.accent .kpi-value{ color:#14532d; }

    #freiheit .chart-section{ margin-top:22px; }
    #freiheit .chart-card{ padding:18px 18px 10px; border:1px solid var(--ring); border-radius:18px; background:rgba(248,250,252,.58); box-shadow:0 12px 28px rgba(15,23,42,.08); }
    #freiheit .chart-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    #freiheit .legend{ display:flex; gap:16px; align-items:center; color:var(--muted); font-weight:600; font-size:12px; }
    #freiheit .legend .dot{ width:12px; height:12px; box-shadow:none; }
    #freiheit #chart{ width:100%; height:360px; }
    #freiheit #chart .bar-stack{ transform-origin: bottom; transform-box: fill-box; transition: transform .9s cubic-bezier(.22,.61,.36,1); }


    #freiheit .empty{ color:var(--muted); text-align:center; padding:18px; border:1px dashed var(--ring); border-radius:12px; background:rgba(255,255,255,.36); }

    @media (max-width: 760px){
      #freiheit{ padding:22px 12px 44px; }
      #freiheit header{ padding:14px 16px 8px; gap:6px 8px; }
      #freiheit h1{ font-size:24px; letter-spacing:-0.15px; }
      #freiheit main{ padding:18px 18px 28px; }
      #freiheit .grid{ gap:16px; }
      #freiheit .panel{ padding:16px; border-radius:18px; box-shadow:0 12px 26px rgba(15,23,42,.08); }
      #freiheit .form-grid{ gap:14px; }
      #freiheit label{ font-size:13px; margin-bottom:4px; }
      #freiheit .input, #freiheit select.input{ padding:13px 14px; font-size:15px; }
      #freiheit .kpis{ grid-template-columns:1fr; gap:12px; }
      #freiheit .kpi{ min-height:86px; padding:12px 14px; }
      #freiheit .kpi-value{ font-size:20px; }
      #freiheit .kpi.endcap{ order:-1; min-height:110px; border-radius:16px; }
      #freiheit .chart-section{ margin-top:16px; }
      #freiheit #chart{ height:280px; }
    }
  </style>
</head>
<body>
  <div id="freiheit">
    <div class="app">
      <div class="orb"></div>
      <div class="shell">
      <header>
        <div class="head-left">
          <div class="eyebrow"><span class="dot"></span> Finanzielle Freiheit</div>
          <h1>Projektions-Tool</h1>
        </div>
        <div class="save-meta" id="status-meta">Speichert deine Eingaben automatisch.</div>
      </header>
      <main>
        <div class="grid cols-2">
          <section class="panel">
            <div class="form-grid cols-2">
              <div>
                <label for="ausgaben">Ziel-Monatslohn</label>
                <div class="input-wrap">
                  <input id="ausgaben" class="input" inputmode="numeric" value="3'800" />
                  <span class="suffix">CHF</span>
                </div>
              </div>
              <div>
                <label for="jahre">Jahre bis Freiheit</label>
                <div class="input-wrap">
                  <input id="jahre" class="input" inputmode="numeric" value="20" />
                  <span class="suffix">Jahre</span>
                </div>
              </div>
              <div>
                <label for="inflation">Inflation</label>
                <div class="input-wrap">
                  <input id="inflation" class="input" inputmode="decimal" value="2.0" />
                  <span class="suffix">%</span>
                </div>
              </div>
              <div>
                <label for="entnahme">Entnahmerate <span class="hint">z.B. 3.5%</span></label>
                <div class="input-wrap">
                  <input id="entnahme" class="input" inputmode="decimal" value="3.5" />
                  <span class="suffix">%</span>
                </div>
              </div>
              <div>
                <label for="start">Startkapital</label>
                <div class="input-wrap">
                  <input id="start" class="input" inputmode="numeric" value="5'000" />
                  <span class="suffix">CHF</span>
                </div>
              </div>
              <div>
                <label for="rendite">Erwartete Rendite</label>
                <div class="input-wrap">
                  <input id="rendite" class="input" inputmode="decimal" value="6.0" />
                  <span class="suffix">%</span>
                </div>
              </div>
            </div>
          </section>

          <section class="panel" id="results-panel">
            <div class="kpis">
              <div class="kpi endcap">
                <div>
                  <div class="kpi-label">Benötigtes Endkapital</div>
                  <div class="kpi-value" id="endkapital">–</div>
                </div>
              </div>
              <div class="kpi accent">
                <div class="kpi-label">Erforderliche Sparrate</div>
                <div class="kpi-value" id="sparrate">–</div>
              </div>
              <div class="kpi">
                <div class="kpi-label">Kumulierte Einzahlungen</div>
                <div class="kpi-value" id="einzahlungen">–</div>
              </div>
              <div class="kpi">
                <div class="kpi-label">Zinsanteil</div>
                <div class="kpi-value" id="zinsen">–</div>
              </div>
            </div>
          </section>
        </div>

        <section class="chart-section">
          <div class="chart-card">
            <div class="chart-head">
              <h3 style="margin:0;">Entwicklung bis zur Freiheit</h3>
              <div class="legend">
                <span class="dot" style="background:var(--accent);"></span> Zinserträge
                <span class="dot" style="background:var(--accent-2);"></span> Kapitalbestand
                <span class="dot" style="background:#ef4444;"></span> Kapitalentnahme
              </div>
            </div>
            <svg id="chart" viewBox="0 0 1080 360" aria-label="Kapitalverlauf"></svg>
          </div>
        </section>
      </main>
    </div>
  </div>
  </div>

  <script>
    (function(){
      const CHF0 = (n)=> new Intl.NumberFormat('de-CH',{style:'currency',currency:'CHF',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
      const INT = new Intl.NumberFormat('de-CH');

      const el = {
        expenses: document.getElementById('ausgaben'),
        years: document.getElementById('jahre'),
        inflation: document.getElementById('inflation'),
        withdrawal: document.getElementById('entnahme'),
        start: document.getElementById('start'),
        return: document.getElementById('rendite'),
        end: document.getElementById('endkapital'),
        rate: document.getElementById('sparrate'),
        deposits: document.getElementById('einzahlungen'),
        interest: document.getElementById('zinsen'),
        chart: document.getElementById('chart'),
        statusMeta: document.getElementById('status-meta')
      };

      const STORAGE_KEY = 'freiheit-rechner-v1';
      const lastValues = { end:0, rate:0, deposits:0, interest:0 };

      const debounce = (fn, delay=140)=>{
        let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), delay); };
      };

      const sanitizeInt = (value)=> parseInt(String(value).replace(/[^\d]/g,'')) || 0;
      const sanitizeFloat = (value)=> parseFloat(String(value).replace(/'/g,'').replace(',','.')) || 0;
      const formatThousands = (input)=> input.value = INT.format(sanitizeInt(input.value));

      [el.expenses, el.years, el.start].forEach(i=>{
        formatThousands(i);
        i.addEventListener('focus', ()=> i.select());
        i.addEventListener('blur', ()=> formatThousands(i));
        i.addEventListener('input', ()=> i.value = i.value.replace(/[^\d' ]/g,'').replace(/\s+/g,''));
      });
      [el.inflation, el.withdrawal, el.return].forEach(i=>{
        i.addEventListener('focus', ()=> i.select());
        i.addEventListener('input', ()=> i.value = i.value.replace(/[^0-9.,-]/g,''));
      });

      function calculate(){
        const expenses = sanitizeInt(el.expenses.value);
        const years = Math.max(0, sanitizeInt(el.years.value));
        const inflation = Math.max(0, sanitizeFloat(el.inflation.value))/100;
        const withdrawal = Math.max(0.1, sanitizeFloat(el.withdrawal.value))/100;
        const start = sanitizeInt(el.start.value);
        const expectedReturn = Math.max(0, sanitizeFloat(el.return.value))/100;

        const inflationFactor = Math.pow(1 + inflation, years);
        const futureMonthly = expenses * inflationFactor;
        const annualNeeds = futureMonthly * 12;
        const requiredCapital = annualNeeds / withdrawal;

        const months = Math.max(1, years*12);
        const rMonthly = expectedReturn/12;
        const growthStart = start * Math.pow(1 + rMonthly, months);
        const numerator = requiredCapital - growthStart;
        const denom = rMonthly === 0 ? months : (Math.pow(1 + rMonthly, months) - 1) / rMonthly;
        const monthlySaving = Math.max(0, numerator / denom);

        const projection = buildProjection({ start, monthlySaving, months, rMonthly });
        const finalBalance = projection.balances[projection.balances.length-1] || 0;
        const totalDeposits = start + monthlySaving * months;
        const interestPortion = Math.max(0, finalBalance - totalDeposits);

        const withdrawalPhase = buildWithdrawal({
          startBalance: finalBalance,
          monthlyNeed: futureMonthly,
          rMonthly,
          startYear: years,
          durationYears: 10
        });

        const barYears = projection.years.concat(withdrawalPhase.years);
        const baseParts = projection.balances.map((b, i)=> Math.max(0, b - projection.interests[i]))
          .concat(withdrawalPhase.balances.map((b, i)=> Math.max(0, b - withdrawalPhase.interests[i])));
        const interestParts = projection.interests.concat(withdrawalPhase.interests);
        const withdrawalParts = projection.years.map(()=> 0).concat(withdrawalPhase.withdrawals);

        renderKpis(requiredCapital, monthlySaving, totalDeposits, interestPortion);
        renderChart({
          barYears,
          baseParts,
          interests: interestParts,
          withdrawals: withdrawalParts,
          withdrawalStartYear: years,
          withdrawalDuration: withdrawalPhase.duration
        });
        persistState();
      }

      function buildProjection({ start, monthlySaving, months, rMonthly }){
        let balance = start;
        let depositSum = start;
        let interestAcc = 0;
        const years = [], deposits=[], interests=[], balances=[];

        for(let m=1; m<=months; m++){
          const interest = balance * rMonthly;
          interestAcc += interest;
          balance = balance + interest + monthlySaving;
          depositSum += monthlySaving;
          if(m % 12 === 0){
            const year = m/12;
            years.push(year);
            balances.push(balance);
            deposits.push(depositSum);
            interests.push(Math.max(0, interestAcc));
            interestAcc = 0;
          }
        }
        return { years, deposits, interests, balances };
      }

      function buildWithdrawal({ startBalance, monthlyNeed, rMonthly, startYear, durationYears }){
        let balance = startBalance;
        const years = [], balances = [], interests=[], withdrawals=[];

        const months = durationYears * 12;
        let interestAcc = 0;
        for(let m=1; m<=months; m++){
          const interest = balance * rMonthly;
          interestAcc += Math.max(0, interest);
          balance = balance + interest - monthlyNeed;
          if(m % 12 === 0){
            years.push(startYear + m/12);
            balances.push(balance);
            interests.push(Math.max(0, interestAcc));
            withdrawals.push(monthlyNeed * 12);
            interestAcc = 0;
          }
        }
        return { years, balances, interests, withdrawals, duration: durationYears };
      }

      function animateValue(elTarget, from, to, formatter, duration=520){
        const start = performance.now();
        const delta = to - from;
        const ease = (t)=> 1 - Math.pow(1 - t, 3);

        function frame(now){
          const progress = Math.min(1, (now - start) / duration);
          const eased = ease(progress);
          const val = from + delta * eased;
          elTarget.textContent = formatter(val);
          if(progress < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function renderKpis(endCap, rate, deposits, interest){
        animateValue(el.end, lastValues.end, endCap, CHF0);
        animateValue(el.rate, lastValues.rate, rate, CHF0);
        animateValue(el.deposits, lastValues.deposits, deposits, CHF0);
        animateValue(el.interest, lastValues.interest, interest, CHF0);

        lastValues.end = endCap;
        lastValues.rate = rate;
        lastValues.deposits = deposits;
        lastValues.interest = interest;
      }

      function renderChart({ barYears, baseParts, interests, withdrawals, withdrawalStartYear, withdrawalDuration }){
        const svg = el.chart;
        svg.innerHTML = '';

        const W = 1080, H = 360, pad = { l:64, r:24, t:18, b:34 };
        const iw = W - pad.l - pad.r;
        const ih = H - pad.t - pad.b;
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

        const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
        defs.innerHTML = `
          <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a2f1a6" />
            <stop offset="100%" stop-color="#7ed957" />
          </linearGradient>
          <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b3c6ff" />
            <stop offset="100%" stop-color="#5b7cfa" />
          </linearGradient>
          <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fca5a5" />
            <stop offset="100%" stop-color="#ef4444" />
          </linearGradient>`;
        svg.appendChild(defs);

        const positiveHeights = barYears.map((_,i)=> Math.max(0, baseParts[i] + withdrawals[i]) + Math.max(0, interests[i]));
        const chartMax = Math.max(...positiveHeights, 1) * 1.08;
        const chartMin = 0;
        const chartRange = Math.max(1, chartMax - chartMin);
        const yScale = (val)=> ih - ((val - chartMin) / chartRange) * ih;
        const steps = 5;

        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('transform', `translate(${pad.l},${pad.t})`);
        svg.appendChild(g);

        for(let i=0;i<steps;i++){
          const yBottom = yScale(chartMin + (chartRange/steps)*i);
          const yTop = yScale(chartMin + (chartRange/steps)*(i+1));
          const band = document.createElementNS('http://www.w3.org/2000/svg','rect');
          band.setAttribute('x',0); band.setAttribute('width', iw);
          band.setAttribute('y', yTop);
          band.setAttribute('height', yBottom - yTop);
          band.setAttribute('fill', i%2===0 ? 'rgba(15,23,42,.014)' : 'rgba(15,23,42,.02)');
          g.appendChild(band);
        }

        for(let i=0;i<=steps;i++){
          const value = chartMin + (chartRange/steps)*i;
          const y = yScale(value);
          const line = document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('x1',0); line.setAttribute('y1',y);
          line.setAttribute('x2',iw); line.setAttribute('y2',y);
          line.setAttribute('stroke','rgba(148,163,184,.32)');
          line.setAttribute('stroke-dasharray','2 4');
          g.appendChild(line);

          const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
          lbl.textContent = INT.format(Math.round(value));
          lbl.setAttribute('x', -12);
          lbl.setAttribute('y', y+4);
          lbl.setAttribute('fill', '#8fa3c0');
          lbl.setAttribute('font-size','11');
          lbl.setAttribute('text-anchor','end');
          g.appendChild(lbl);
        }

        const totalYears = withdrawalStartYear + withdrawalDuration;
        const yearSpacing = totalYears > 1 ? iw / (totalYears - 1) : iw;

        const n = barYears.length;
        if(n === 0){
          const empty = document.createElementNS('http://www.w3.org/2000/svg','text');
          empty.textContent = 'Noch keine Daten';
          empty.setAttribute('x', W/2);
          empty.setAttribute('y', H/2);
          empty.setAttribute('fill','#94a3b8');
          empty.setAttribute('font-size','13');
          empty.setAttribute('text-anchor','middle');
          svg.appendChild(empty);
          return;
        }

        const barW = Math.max(6, yearSpacing * 0.5);

        for(let i=0;i<n;i++){
          const x = (barYears[i]-1) * yearSpacing - barW/2;
          const zeroY = yScale(0);
          const capRemaining = Math.max(0, baseParts[i]);
          const capWithWithdrawal = Math.max(0, baseParts[i] + withdrawals[i]);
          const intTop = yScale(capWithWithdrawal + Math.max(0, interests[i]));
          const capTopFull = yScale(capWithWithdrawal);
          const capTopRemain = yScale(capRemaining);

          const holder = document.createElementNS('http://www.w3.org/2000/svg','g');
          holder.setAttribute('transform', `translate(${x}, 0)`);

          const stack = document.createElementNS('http://www.w3.org/2000/svg','g');
          stack.setAttribute('class','bar-stack');
          stack.style.transform = 'scaleY(0.02)';

          const intRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
          intRect.setAttribute('x', 0);
          intRect.setAttribute('y', intTop);
          intRect.setAttribute('width', barW);
          intRect.setAttribute('height', Math.max(0, capTopFull - intTop));
          intRect.setAttribute('fill', 'url(#green)');
          intRect.setAttribute('rx','3');
          stack.appendChild(intRect);

          const baseRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
          baseRect.setAttribute('x', 0);
          baseRect.setAttribute('y', capTopRemain);
          baseRect.setAttribute('width', barW);
          baseRect.setAttribute('height', Math.max(0, zeroY - capTopRemain));
          baseRect.setAttribute('fill', 'url(#blue)');
          baseRect.setAttribute('rx','3');
          baseRect.setAttribute('opacity','0.92');
          stack.appendChild(baseRect);

          if(withdrawals[i] > 0){
            const drawRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
            drawRect.setAttribute('x', 0);
            drawRect.setAttribute('y', capTopFull);
            drawRect.setAttribute('width', barW);
            drawRect.setAttribute('height', Math.max(0, capTopRemain - capTopFull));
            drawRect.setAttribute('fill', 'url(#red)');
            drawRect.setAttribute('rx','3');
            drawRect.setAttribute('opacity','0.95');
            stack.appendChild(drawRect);
          }

          holder.appendChild(stack);
          g.appendChild(holder);

          requestAnimationFrame(()=>{
            const delay = i * 16;
            setTimeout(()=>{ stack.style.transform = 'scaleY(1)'; }, delay);
          });

          const px = x + barW/2;
          if((barYears[i] % 2 === 0) || i === n-1){
            const tx = document.createElementNS('http://www.w3.org/2000/svg','text');
            tx.textContent = barYears[i];
            tx.setAttribute('x', px);
            tx.setAttribute('y', ih + 18);
            tx.setAttribute('fill','#8fa3c0');
            tx.setAttribute('font-size','11');
            tx.setAttribute('text-anchor','middle');
            g.appendChild(tx);
          }
        }

        if(withdrawalDuration){
          const xStart = (withdrawalStartYear - 1) * yearSpacing;
          const wRect = withdrawalDuration * yearSpacing;
          const overlay = document.createElementNS('http://www.w3.org/2000/svg','rect');
          overlay.setAttribute('x', pad.l + xStart);
          overlay.setAttribute('y', pad.t);
          overlay.setAttribute('width', wRect);
          overlay.setAttribute('height', ih);
          overlay.setAttribute('fill','rgba(14,165,233,0.08)');
          overlay.setAttribute('stroke','rgba(14,165,233,0.18)');
          overlay.setAttribute('stroke-dasharray','6 6');
          svg.appendChild(overlay);
        }

        const xLbl = document.createElementNS('http://www.w3.org/2000/svg','text');
        xLbl.textContent = 'Jahre';
        xLbl.setAttribute('x', pad.l + iw/2);
        xLbl.setAttribute('y', H-6);
        xLbl.setAttribute('fill','#8fa3c0');
        xLbl.setAttribute('font-size','12');
        xLbl.setAttribute('text-anchor','middle');
        svg.appendChild(xLbl);
      }

      function loadState(){
        try{
          const raw = localStorage.getItem(STORAGE_KEY);
          if(!raw) return;
          const state = JSON.parse(raw);
          if(state.expenses) el.expenses.value = state.expenses;
          if(state.years) el.years.value = state.years;
          if(state.inflation) el.inflation.value = state.inflation;
          if(state.withdrawal) el.withdrawal.value = state.withdrawal;
          if(state.start) el.start.value = state.start;
          if(state.return) el.return.value = state.return;
          [el.expenses, el.years, el.start].forEach(formatThousands);
          updateStatusMeta(state.savedAt);
        }catch(e){ console.warn('Konnte gespeicherte Daten nicht laden', e); }
      }

      function persistState(){
        const savedAt = Date.now();
        const payload = {
          expenses: el.expenses.value,
          years: el.years.value,
          inflation: el.inflation.value,
          withdrawal: el.withdrawal.value,
          start: el.start.value,
          return: el.return.value,
          savedAt
        };
        try{
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          updateStatusMeta(savedAt);
        }catch(e){ console.warn('Konnte Daten nicht speichern', e); }
      }

      const formatSavedAt = (ts)=> new Intl.DateTimeFormat('de-CH',{ dateStyle:'short', timeStyle:'medium' }).format(ts);

      function updateStatusMeta(savedAt){
        if(!el.statusMeta) return;
        if(savedAt){
          el.statusMeta.textContent = `Gespeichert um ${formatSavedAt(savedAt)}`;
        }else{
          el.statusMeta.textContent = 'Speichert deine Eingaben automatisch.';
        }
      }

      function registerEvents(){
        [el.expenses, el.years, el.start, el.inflation, el.withdrawal, el.return].forEach(input=>{
          input.addEventListener('input', ()=> calculateDebounced());
          input.addEventListener('blur', ()=> calculate());
        });
      }

      const calculateDebounced = debounce(calculate, 160);

      loadState();
      registerEvents();
      calculate();
    })();
  </script>
</body>
</html>
