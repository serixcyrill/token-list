<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zinseszinsrechner – Modernes UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f8fb;
      --card:#ffffff;
      --muted:#6b7280;
      --muted-2:#94a3b8;
      --accent:#7ed957;
      --accent-2:#5b7cfa;
      --ring:rgba(17,24,39,.08);
      --ring-strong:rgba(126,217,87,.35);
      --glass:rgba(255,255,255,.52);
      --panel:rgba(255,255,255,.62);
      --radius:18px;
      --shadow:0 18px 40px rgba(15,23,42,.10);
    }

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 16% 24%, rgba(126,217,87,.10), transparent 26%),
        radial-gradient(circle at 86% 16%, rgba(91,124,250,.10), transparent 24%),
        linear-gradient(180deg,#fbfcff 0%, #eef2ff 100%);
    }

    #zinseszins-app *,
    #zinseszins-app *::before,
    #zinseszins-app *::after{ box-sizing:border-box; }

    #zinseszins-app{
      color:#0f172a;
      font-family:'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
      padding:28px 16px 60px;
      background:transparent;
      position:relative;
      isolation:isolate;
    }

    #zinseszins-app .app{
      max-width:1080px;
      margin:0 auto;
      position:relative;
    }
    #zinseszins-app .orb{
      position:absolute;
      inset:0;
      filter:blur(90px);
      opacity:0;
      background:none;
      z-index:0;
      pointer-events:none;
    }
    #zinseszins-app .shell{
      position:relative; z-index:1;
      background:var(--glass);
      border:1px solid var(--ring);
      border-radius:26px;
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(10px);
    }

    #zinseszins-app header{
      padding:14px 20px 8px;
      border-bottom:1px solid var(--ring);
      display:flex;
      flex-wrap:wrap;
      gap:8px 12px;
      align-items:flex-start;
      justify-content:space-between;
      background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 70%);
    }
    #zinseszins-app .head-left{ display:flex; flex-direction:column; gap:2px; }
    #zinseszins-app .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 11px;
      background:rgba(248,250,252,.85);
      border:1px solid var(--ring);
      border-radius:999px;
      color:#0f172a;
      font-weight:700;
      font-size:11px;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    #zinseszins-app .dot{ width:8px; height:8px; border-radius:99px; background:var(--accent); box-shadow:none; }
    #zinseszins-app h1{
      margin:0;
      font-size:30px;
      font-family:'Space Grotesk', 'Inter', system-ui;
      font-weight:800;
      letter-spacing:-0.25px;
      color:#0f172a;
    }

    #zinseszins-app .save-meta{
      color:#475569;
      font-weight:600;
      font-size:13px;
      background:rgba(255,255,255,.6);
      border:1px solid var(--ring);
      padding:8px 10px;
      border-radius:12px;
      box-shadow:0 8px 20px rgba(15,23,42,.06);
    }

    #zinseszins-app main{ padding:24px 28px 36px; }
    #zinseszins-app .grid{
      display:grid;
      gap:20px;
    }
    @media (min-width: 860px){
      #zinseszins-app .grid.cols-2{ grid-template-columns:1.05fr 0.95fr; align-items:stretch; }
    }

    #zinseszins-app .panel{
      background:var(--panel);
      border:1px solid var(--ring);
      border-radius:22px;
      padding:22px;
      box-shadow:0 14px 32px rgba(15,23,42,.08);
      display:flex;
      flex-direction:column;
      height:100%;
    }

    #zinseszins-app .form-grid{ display:grid; gap:18px; }
    @media (min-width: 640px){ #zinseszins-app .form-grid.cols-2{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

    #zinseszins-app label{
      font-weight:700;
      color:#0f172a;
      display:flex;
      justify-content:space-between;
      font-size:14px;
      margin-bottom:6px;
    }
    #zinseszins-app .hint{ color:var(--muted); font-weight:600; font-size:12px; }

      #zinseszins-app .input, #zinseszins-app select.input{
      width:100%;
        border:1px solid var(--ring);
      background:rgba(248,250,252,.56);
      color:#0f172a;
      font-size:15px;
      padding:14px 16px;
      border-radius:14px;
      outline:none;
      transition: border-color .2s ease, box-shadow .2s ease, transform .12s ease, background-color .2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
    }
      #zinseszins-app .input:focus{ border-color:var(--ring-strong); box-shadow:0 0 0 4px rgba(126,217,87,.15); background:rgba(255,255,255,.78); }
      #zinseszins-app .input:active{ transform:translateY(1px); }

      #zinseszins-app .input-wrap{ position:relative; }
      #zinseszins-app .suffix{
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      color:var(--muted); font-size:12px; font-weight:700; letter-spacing:0.1px;
    }
      #zinseszins-app select.input{ appearance:none; cursor:pointer; padding-right:48px; background-image:url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5' stroke='%239fb3d0' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 14px center; }

    #zinseszins-app .kpis{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-top:18px; align-items:stretch; }
      #zinseszins-app .kpi{
      background:var(--panel);
      border:1px solid var(--ring);
      border-radius:14px;
      padding:14px 16px 12px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-height:92px;
      box-shadow:0 12px 28px rgba(15,23,42,.06);
    }
      #zinseszins-app .kpi-label{ color:var(--muted); font-size:13px; }
      #zinseszins-app .kpi-value{ font-size:22px; font-weight:800; letter-spacing:-0.2px; margin-top:4px; color:#0f172a; transition:color .2s ease; }

      #zinseszins-app .kpi.endcap{
      grid-column:1 / -1;
      flex-direction:row;
      align-items:center;
      gap:12px;
      padding:18px 22px;
      min-height:120px;
      background:linear-gradient(180deg,rgba(243,246,255,.64) 0%, rgba(255,255,255,.56) 90%);
      border:1px solid rgba(91,124,250,.14);
      box-shadow:0 18px 36px rgba(91,124,250,.08);
    }
      #zinseszins-app .kpi.endcap .kpi-label{ font-size:14px; color:#0f172a; letter-spacing:0; }
      #zinseszins-app .kpi.endcap .kpi-value{ font-size:30px; color:#0f172a; }

      #zinseszins-app .kpi.accent{
      background:linear-gradient(180deg,rgba(126,217,87,.12) 0%, rgba(126,217,87,.06) 70%);
      border-color:rgba(126,217,87,.30);
      box-shadow:0 18px 34px rgba(126,217,87,.08);
    }
      #zinseszins-app .kpi.accent .kpi-label{ color:#0f172a; }
      #zinseszins-app .kpi.accent .kpi-value{ color:#14532d; }

      #zinseszins-app .chart-section{ margin-top:22px; }
      #zinseszins-app .chart-card{ padding:18px 18px 10px; border:1px solid var(--ring); border-radius:18px; background:rgba(248,250,252,.58); box-shadow:0 12px 28px rgba(15,23,42,.08); }
      #zinseszins-app .chart-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
      #zinseszins-app .legend{ display:flex; gap:16px; align-items:center; color:var(--muted); font-weight:600; font-size:12px; }
      #zinseszins-app .legend .dot{ width:12px; height:12px; box-shadow:none; }
    #zinseszins-app #chart{ width:100%; height:360px; }
    #zinseszins-app #chart .bar-stack{ transform-origin: bottom; transform-box: fill-box; transition: transform .9s cubic-bezier(.22,.61,.36,1); }

      #zinseszins-app .empty{ color:var(--muted); text-align:center; padding:18px; border:1px dashed var(--ring); border-radius:12px; background:rgba(255,255,255,.36); }

    @media (max-width: 760px){
      #zinseszins-app{ padding:22px 12px 44px; }
      #zinseszins-app header{ padding:14px 16px 8px; gap:6px 8px; }
        #zinseszins-app h1{ font-size:24px; letter-spacing:-0.15px; }
      #zinseszins-app main{ padding:18px 18px 28px; }
      #zinseszins-app .grid{ gap:16px; }
      #zinseszins-app .panel{ padding:16px; border-radius:18px; box-shadow:0 12px 26px rgba(15,23,42,.08); }
      #zinseszins-app .form-grid{ gap:14px; }
      #zinseszins-app label{ font-size:13px; margin-bottom:4px; }
      #zinseszins-app .input, #zinseszins-app select.input{ padding:13px 14px; font-size:15px; }
      #zinseszins-app button{ margin-top:10px; padding:15px; border-radius:14px; }
      #zinseszins-app .kpis{ grid-template-columns:1fr; gap:12px; }
      #zinseszins-app .kpi{ min-height:86px; padding:12px 14px; }
      #zinseszins-app .kpi-value{ font-size:20px; }
      #zinseszins-app .kpi.endcap{ order:-1; min-height:110px; border-radius:16px; }
      #zinseszins-app .chart-section{ margin-top:16px; }
      #zinseszins-app #chart{ height:280px; }
    }
  </style>
</head>
<body>
  <div id="zinseszins-app">
    <div class="app">
      <div class="orb"></div>
      <div class="shell">
      <header>
        <div class="head-left">
          <div class="eyebrow"><span class="dot"></span> Projektions-Tool</div>
          <h1>Zinseszinsrechner</h1>
        </div>
        <div class="save-meta" id="status-meta">Speichert deine Eingaben automatisch.</div>
      </header>
      <main>
        <div class="grid cols-2">
          <section class="panel">
            <div class="form-grid cols-2">
              <div>
                <label for="anfang">Anfangskapital</label>
                <div class="input-wrap">
                  <input id="anfang" class="input" inputmode="numeric" value="5'000" />
                  <span class="suffix">CHF</span>
                </div>
              </div>
              <div>
                <label for="rate">Monatliche Sparrate</label>
                <div class="input-wrap">
                  <input id="rate" class="input" inputmode="numeric" value="250" />
                  <span class="suffix">CHF</span>
                </div>
              </div>
              <div>
                <label for="dauer">Spardauer</label>
                <div class="input-wrap">
                  <input id="dauer" class="input" inputmode="numeric" value="12" />
                  <span class="suffix">Jahre</span>
                </div>
              </div>
              <div>
                <label for="zins">Jährlicher Zinssatz <span class="hint">z.B. 6%</span></label>
                <div class="input-wrap">
                  <input id="zins" class="input" inputmode="decimal" value="6" />
                  <span class="suffix">%</span>
                </div>
              </div>
            </div>
            <div style="margin-top:14px;">
              <label for="intervall">Ausschüttungsintervall</label>
              <select id="intervall" class="input">
                <option value="jahrlich">jährlich</option>
                <option value="quartalsweise">quartalsweise</option>
                <option value="monatlich">monatlich</option>
              </select>
            </div>
          </section>

          <section class="panel" id="results-panel">
            <div class="kpis">
              <div class="kpi">
                <div class="kpi-label">Zinserträge</div>
                <div class="kpi-value" id="zinsen">–</div>
              </div>
              <div class="kpi">
                <div class="kpi-label">Gesamteinzahlungen</div>
                <div class="kpi-value" id="einzahlungen">–</div>
              </div>
              <div class="kpi endcap">
                <div>
                  <div class="kpi-label">Endkapital</div>
                  <div class="kpi-value" id="endkapital">–</div>
                </div>
              </div>
            </div>
          </section>
        </div>

        <section class="chart-section">
          <div class="chart-card">
            <div class="chart-head">
              <h3 style="margin:0;">Jahres-Chart</h3>
              <div class="legend">
                <span class="dot" style="background:var(--accent);"></span> Zinsen
                <span class="dot" style="background:var(--accent-2);"></span> Einzahlungen
              </div>
            </div>
            <svg id="chart" viewBox="0 0 1080 360" aria-label="Zinseszins Diagramm"></svg>
          </div>
        </section>
      </main>
    </div>
  </div>
  </div>

  <script>
    (function(){
      const CHF0 = (n)=> new Intl.NumberFormat('de-CH',{style:'currency',currency:'CHF',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
      const INT = new Intl.NumberFormat('de-CH');

      const el = {
        principal: document.getElementById('anfang'),
        monthly: document.getElementById('rate'),
        years: document.getElementById('dauer'),
        rate: document.getElementById('zins'),
        interval: document.getElementById('intervall'),
        end: document.getElementById('endkapital'),
        interest: document.getElementById('zinsen'),
        deposits: document.getElementById('einzahlungen'),
        chart: document.getElementById('chart'),
        statusMeta: document.getElementById('status-meta')
      };

      const STORAGE_KEY = 'zinseszinsrechner-state-v1';
      const lastValues = { end: 0, deposits: 0, interest: 0 };

      const debounce = (fn, delay=140)=>{
        let t;
        return (...args)=>{
          clearTimeout(t);
          t = setTimeout(()=> fn(...args), delay);
        };
      };

      const sanitizeInt = (value)=> parseInt(String(value).replace(/[^\d]/g,'')) || 0;
      const sanitizeFloat = (value)=> parseFloat(String(value).replace(/'/g,'').replace(',','.')) || 0;
      const formatThousands = (input)=> input.value = INT.format(sanitizeInt(input.value));

      [el.principal, el.monthly, el.years].forEach(i=>{
        formatThousands(i);
        i.addEventListener('focus', ()=> i.select());
        i.addEventListener('blur', ()=> formatThousands(i));
        i.addEventListener('input', ()=> i.value = i.value.replace(/[^\d' ]/g,'').replace(/\s+/g,''));
      });
      el.rate.addEventListener('focus', ()=> el.rate.select());
      el.rate.addEventListener('input', ()=> el.rate.value = el.rate.value.replace(/[^0-9.,]/g,''));

      function calculate(){
        const principal = sanitizeInt(el.principal.value);
        const monthly = sanitizeInt(el.monthly.value);
        const years = Math.max(0, sanitizeInt(el.years.value));
        const rate = Math.max(0, sanitizeFloat(el.rate.value))/100;
        const interval = el.interval.value;

        const compoundsPerYear = interval === 'monatlich' ? 12 : interval === 'quartalsweise' ? 4 : 1;
        const monthsPerCompound = 12 / compoundsPerYear;
        const totalMonths = years * 12;

        let balance = principal;
        let pending = 0;
        let depositsToDate = principal;

        const yearsArr = [], depositArr = [], interestArr = [];

        for(let month=1; month<=totalMonths; month++){
          pending += monthly;
          depositsToDate += monthly;

          if(month % monthsPerCompound === 0){
            balance = balance * (1 + rate/compoundsPerYear) + pending;
            pending = 0;
          }

          if(month % 12 === 0){
            const yr = month/12;
            yearsArr.push(yr);
            const interest = Math.max(0, balance - depositsToDate);
            depositArr.push(depositsToDate);
            interestArr.push(interest);
          }
        }

        const totalDeposits = principal + monthly * totalMonths;
        const totalInterest = balance - totalDeposits;

        renderKpis(balance, totalDeposits, totalInterest);
        renderChart(yearsArr, depositArr, interestArr);

        persistState();
      }

      function animateValue(elTarget, from, to, formatter, duration=520){
        const start = performance.now();
        const delta = to - from;
        const ease = (t)=> 1 - Math.pow(1 - t, 3);

        function frame(now){
          const progress = Math.min(1, (now - start) / duration);
          const eased = ease(progress);
          const val = from + delta * eased;
          elTarget.textContent = formatter(val);
          if(progress < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function renderKpis(balance, deposits, interest){
        animateValue(el.end, lastValues.end, balance, CHF0);
        animateValue(el.deposits, lastValues.deposits, deposits, CHF0);
        animateValue(el.interest, lastValues.interest, interest, CHF0);

        lastValues.end = balance;
        lastValues.deposits = deposits;
        lastValues.interest = interest;
      }

      function renderChart(years, deposits, interest){
        const svg = el.chart;
        svg.innerHTML = '';

        const W = 1080, H = 360, pad = { l:64, r:24, t:18, b:34 };
        const iw = W - pad.l - pad.r;
        const ih = H - pad.t - pad.b;
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

        const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
        defs.innerHTML = `
          <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a2f1a6" />
            <stop offset="100%" stop-color="#7ed957" />
          </linearGradient>
          <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b3c6ff" />
            <stop offset="100%" stop-color="#5b7cfa" />
          </linearGradient>`;
        svg.appendChild(defs);

        const totals = deposits.map((d,i)=> d + interest[i]);
        const maxY = Math.max(...totals, 1) * 1.08;
        const steps = 5;

        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('transform', `translate(${pad.l},${pad.t})`);
        svg.appendChild(g);

        for(let i=0;i<steps;i++){
          const y = ih - (ih/steps)*i;
          const band = document.createElementNS('http://www.w3.org/2000/svg','rect');
          band.setAttribute('x',0); band.setAttribute('width', iw);
          band.setAttribute('y', y - ih/steps);
          band.setAttribute('height', ih/steps);
          band.setAttribute('fill', i%2===0 ? 'rgba(15,23,42,.014)' : 'rgba(15,23,42,.02)');
          g.appendChild(band);
        }

        for(let i=0;i<=steps;i++){
          const y = ih - (ih/steps)*i;
          const line = document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('x1',0); line.setAttribute('y1',y);
          line.setAttribute('x2',iw); line.setAttribute('y2',y);
          line.setAttribute('stroke','rgba(148,163,184,.32)');
          line.setAttribute('stroke-dasharray','2 4');
          g.appendChild(line);

          const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
          lbl.textContent = INT.format(Math.round(maxY/steps*i));
          lbl.setAttribute('x', -12);
          lbl.setAttribute('y', y+4);
          lbl.setAttribute('fill', '#8fa3c0');
          lbl.setAttribute('font-size','11');
          lbl.setAttribute('text-anchor','end');
          g.appendChild(lbl);
        }

        const n = years.length;
        if(n === 0){
          const empty = document.createElementNS('http://www.w3.org/2000/svg','text');
          empty.textContent = 'Noch keine Daten';
          empty.setAttribute('x', W/2);
          empty.setAttribute('y', H/2);
          empty.setAttribute('fill','#94a3b8');
          empty.setAttribute('font-size','13');
          empty.setAttribute('text-anchor','middle');
          svg.appendChild(empty);
          return;
        }

        const gap = 6;
        const barW = Math.max(4, (iw - gap*(n-1))/n);

        const points = [];
        for(let i=0;i<n;i++){
          const x = i*(barW+gap);
          const depH = ih * (deposits[i]/maxY);
          const intH = ih * (interest[i]/maxY);
          const totalH = depH + intH;
          const totalVal = Math.max(1, deposits[i] + interest[i]);

          const holder = document.createElementNS('http://www.w3.org/2000/svg','g');
          holder.setAttribute('transform', `translate(${x}, ${ih - totalH})`);

          const stack = document.createElementNS('http://www.w3.org/2000/svg','g');
          stack.setAttribute('class','bar-stack');
          stack.style.transform = 'scaleY(0.02)';

          const intRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
          intRect.setAttribute('x', 0);
          intRect.setAttribute('y', 0);
          intRect.setAttribute('width', barW);
          intRect.setAttribute('height', intH);
          intRect.setAttribute('fill', 'url(#green)');
          intRect.setAttribute('rx','3');
          const intShare = (interest[i] / totalVal) * 100;
          intRect.setAttribute('title', `Zinsanteil: ${intShare.toFixed(1)}%`);
          stack.appendChild(intRect);

          const depRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
          depRect.setAttribute('x', 0);
          depRect.setAttribute('y', intH);
          depRect.setAttribute('width', barW);
          depRect.setAttribute('height', depH);
          depRect.setAttribute('fill', 'url(#blue)');
          depRect.setAttribute('rx','3');
          depRect.setAttribute('opacity','0.92');
          const depShare = (deposits[i] / totalVal) * 100;
          depRect.setAttribute('title', `Einzahlungsanteil: ${depShare.toFixed(1)}%`);
          stack.appendChild(depRect);

          holder.appendChild(stack);
          g.appendChild(holder);

          requestAnimationFrame(()=>{
            const delay = i * 16;
            setTimeout(()=>{ stack.style.transform = 'scaleY(1)'; }, delay);
          });

          const px = x + barW/2;
          const py = ih - totalH;
          points.push([px, py]);

          if((years[i] % 2 === 0) || i === n-1){
            const tx = document.createElementNS('http://www.w3.org/2000/svg','text');
            tx.textContent = years[i];
            tx.setAttribute('x', px);
            tx.setAttribute('y', ih + 18);
            tx.setAttribute('fill','#8fa3c0');
            tx.setAttribute('font-size','11');
            tx.setAttribute('text-anchor','middle');
            g.appendChild(tx);
          }
        }

        const xLbl = document.createElementNS('http://www.w3.org/2000/svg','text');
        xLbl.textContent = 'Jahre';
        xLbl.setAttribute('x', pad.l + iw/2);
        xLbl.setAttribute('y', H-6);
        xLbl.setAttribute('fill','#8fa3c0');
        xLbl.setAttribute('font-size','12');
        xLbl.setAttribute('text-anchor','middle');
        svg.appendChild(xLbl);
      }

      function loadState(){
        try{
          const raw = localStorage.getItem(STORAGE_KEY);
          if(!raw) return;
          const state = JSON.parse(raw);
          const savedAt = state.savedAt;
          if(state.principal) el.principal.value = state.principal;
          if(state.monthly) el.monthly.value = state.monthly;
          if(state.years) el.years.value = state.years;
          if(state.rate) el.rate.value = state.rate;
          if(state.interval) el.interval.value = state.interval;
          [el.principal, el.monthly, el.years].forEach(formatThousands);
          updateStatusMeta(savedAt);
        }catch(e){ console.warn('Konnte gespeicherte Daten nicht laden', e); }
      }

      function persistState(){
        const savedAt = Date.now();
        const payload = {
          principal: el.principal.value,
          monthly: el.monthly.value,
          years: el.years.value,
          rate: el.rate.value,
          interval: el.interval.value,
          savedAt
        };
        try{
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          updateStatusMeta(savedAt);
        }catch(e){ console.warn('Konnte Daten nicht speichern', e); }
      }

      const formatSavedAt = (ts)=> new Intl.DateTimeFormat('de-CH',{ dateStyle:'short', timeStyle:'medium' }).format(ts);

      function updateStatusMeta(savedAt){
        if(!el.statusMeta) return;
        if(savedAt){
          el.statusMeta.textContent = `Gespeichert um ${formatSavedAt(savedAt)}`;
        }else{
          el.statusMeta.textContent = 'Speichert deine Eingaben automatisch.';
        }
      }

      function registerAutosave(){
        [el.principal, el.monthly, el.years, el.rate].forEach(input=>{
          input.addEventListener('input', ()=> calculateDebounced());
          input.addEventListener('blur', ()=> calculate());
        });
        el.interval.addEventListener('change', ()=> calculate());
      }

      const calculateDebounced = debounce(calculate, 160);

      loadState();
      registerAutosave();
      calculate();
    })();
  </script>
</body>
</html>
